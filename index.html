<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quay Chủ Đề</title>
<meta name="description" content="Bốc ngẫu nhiên chủ đề luyện nói theo mục tiêu — không lặp lại cho đến khi quay hết.">
<style>
/* ============================================================
   Quay Chủ Đề — single-file topic spinner
   Dark, warm, editorial look. No build step, no dependencies.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Prata&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');

:root {
  --bg: #100d0a;             /* warm near-black */
  --bg-soft: #17130e;
  --surface: #1d1812;
  --surface-2: #272017;
  --text: #f4eee3;
  --muted: #9d9183;
  --accent: #e8a33b;         /* spotlight amber */
  --accent-strong: #f0b45c;
  --accent-ink: #2a1f0c;
  --border: #322a1f;
  --radius: 12px;            /* blocks/cards max 12px */
  --radius-btn: 10px;        /* buttons 10px */
  --font-display: "Prata", "Times New Roman", Georgia, serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --speed: 0.25s;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1000px 520px at 50% -12%, #241b10 0%, transparent 62%),
    radial-gradient(760px 420px at 85% 110%, #1a140d 0%, transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  min-height: 100dvh;
  overflow-x: clip;
}

/* ---------- Header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 20px;
}
.brand { font-weight: 700; letter-spacing: 0.02em; font-size: 0.95rem; color: var(--muted); }
.brand b { color: var(--text); }
#reset-spun {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font: inherit; font-size: 0.78rem; padding: 7px 12px; border-radius: var(--radius-btn);
  cursor: pointer; transition: color var(--speed), border-color var(--speed);
  white-space: nowrap;
}
#reset-spun:hover { color: var(--text); border-color: var(--muted); }

/* ---------- Main ---------- */
main {
  flex: 1;
  width: min(860px, 100%);
  margin: 0 auto;
  padding: 10px 20px 28px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 5.4vw, 3rem);
  margin: 14px 0 6px;
  letter-spacing: 0.01em;
}
.tagline { color: var(--muted); margin: 0 0 22px; font-size: 0.95rem; }

/* ---------- Goal pills ---------- */
.goals {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 8px;
}
.goal {
  font: inherit; font-size: 0.84rem; font-weight: 600;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;            /* pill chips ≤48px tall: allowed */
  padding: 9px 16px;
  cursor: pointer;
  transition: all var(--speed);
  white-space: nowrap;
}
.goal:hover { color: var(--text); border-color: var(--muted); transform: translateY(-1px); }
.goal.is-active {
  color: var(--accent-ink);
  background: linear-gradient(180deg, var(--accent-strong), var(--accent));
  border-color: transparent;
  box-shadow: 0 6px 20px rgba(232, 163, 59, 0.28);
}
.goal small { font-weight: 500; opacity: 0.75; margin-left: 5px; }

/* ---------- Stage ---------- */
.stage {
  flex: 1;
  width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 44vh;
  padding: 18px 6px;
}
.stage-label {
  font-size: 0.74rem; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.topic {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.7rem, 5.8vw, 3.3rem);
  line-height: 1.22;
  max-width: 20ch;
  margin: 0;
  min-height: 1.2em;
  overflow-wrap: break-word;
}
.stage.revealed .stage-label,
.stage.is-spinning .stage-label { opacity: 1; transform: none; }
.stage.is-spinning .topic { filter: blur(1.5px); opacity: 0.6; }
.stage.revealed .topic { animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes pop {
  from { transform: scale(0.96); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.empty-hint {
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 400;
}
.done-note {
  margin-top: 14px; color: var(--muted); font-size: 0.9rem;
  display: none;
}
.stage.all-done .done-note { display: block; }

/* ---------- Action bar ---------- */
.actions {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-bottom: 6px;
  width: 100%;
}
#spin-btn {
  font: inherit; font-weight: 700; font-size: 1.05rem;
  color: var(--accent-ink);
  background: linear-gradient(180deg, var(--accent-strong), var(--accent));
  border: none; border-radius: var(--radius-btn);
  padding: 15px 44px;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(232, 163, 59, 0.3);
  transition: transform var(--speed), box-shadow var(--speed), filter var(--speed);
}
#spin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(232, 163, 59, 0.38); }
#spin-btn:active { transform: scale(0.98); }
#spin-btn:disabled { filter: saturate(0.4) brightness(0.8); cursor: wait; transform: none; }
.counter { color: var(--muted); font-size: 0.85rem; }
.kbd-hint { color: var(--muted); font-size: 0.78rem; opacity: 0.8; }
.kbd-hint kbd {
  font-family: inherit; font-size: 0.72rem;
  border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 6px; padding: 1px 7px; margin: 0 2px;
  background: var(--surface);
}

/* ---------- Footer (data tools) ---------- */
footer {
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center;
  padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg-soft);
}
.linkish {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 0.82rem; cursor: pointer;
  padding: 6px 2px; text-decoration: none;
  transition: color var(--speed);
}
.linkish:hover { color: var(--text); }
.linkish.hidden { display: none; }
#data-name { color: var(--muted); font-size: 0.82rem; }
#data-name b { color: var(--text); font-weight: 600; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 18px; font-size: 0.88rem;
  max-width: min(92vw, 460px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
  white-space: pre-line; text-align: center;
  animation: toast-in 0.3s ease;
  z-index: 60;
}
.toast.out { opacity: 0; transition: opacity 0.4s ease; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ---------- Mobile ---------- */
@media (max-width: 480px) {
  main { padding: 6px 16px 20px; }
  .stage { min-height: 38vh; }
  #spin-btn { width: 100%; padding: 15px 20px; }
  .kbd-hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <span class="brand">🎯 <b>Quay Chủ Đề</b></span>
  <button id="reset-spun" type="button" title="Xóa dấu các chủ đề đã quay">↺ Đặt lại đã quay</button>
</header>

<main>
  <h1>Hôm nay nói gì?</h1>
  <p class="tagline">Chọn mục tiêu rồi bấm quay — mỗi chủ đề chỉ xuất hiện một lần cho đến khi quay hết.</p>

  <div class="goals" id="goals" role="tablist" aria-label="Mục tiêu luyện tập"></div>

  <section class="stage" id="stage" aria-live="polite">
    <span class="stage-label" id="stage-label">Chủ đề của bạn</span>
    <h2 class="topic" id="topic"></h2>
    <p class="done-note" id="done-note">🎉 Bạn đã quay hết chủ đề trong mục tiêu này.</p>
  </section>

  <div class="actions">
    <button id="spin-btn" type="button">Quay</button>
    <span class="counter" id="counter"></span>
    <span class="kbd-hint">nhấn <kbd>space</kbd> để quay</span>
  </div>
</main>

<footer>
  <span id="data-name"></span>
  <button class="linkish" id="load-btn" type="button">📂 Nạp bộ chủ đề khác (JSON)</button>
  <button class="linkish hidden" id="default-btn" type="button">↩︎ Về bộ mặc định</button>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
</footer>

<script>
'use strict';
/* ============================================================
   Data — embedded at build time from topics.json.
   Schema: [ { group, topics: [ {title, ...} | "title" ] } ]
   (extra fields like "skills"/"questions" are accepted and ignored,
    so the same topics.json also works for the Weekly Speaking app)
   ============================================================ */
const EMBEDDED_DATA = [{"group":"Storytelling (Kể chuyện)","topics":["Kể về một niềm tin tiêu cực bạn từng mang (“tôi phải hoàn hảo”, “tôi phải làm mọi người hài lòng”) và khoảnh khắc bạn nhận ra nó đang điều khiển mình.","Chọn 1 dòng trong bảng chuyển hóa niềm tin của nhóm, kể chuyện thật của bạn theo 3 nấc: niềm tin tiêu cực → niềm tin cân bằng → niềm tin nuôi dưỡng.","Trong 3 nhóm niềm tin về bản thân — Năng lực, Đáng được yêu, Giá trị — nhóm nào bạn thấy mình “yếu” nhất? Kể một tình huống tuần này cho thấy điều đó.","“Tảng băng chìm”: kể một hành vi bạn hay lặp lại (trì hoãn, cả nể, nổi nóng) rồi đào xuống phần chìm — cảm xúc và niềm tin nào nằm bên dưới?","Bạn từng cả nể hay tin người đến mức chịu thiệt? Kể lại, và nói vì sao đến giờ bạn vẫn chọn (hoặc thôi) tin người.","Một lời khen hay lời chê từ nhiều năm trước vẫn còn “vang” trong đầu bạn đến hôm nay: đó là câu gì, và nó đã định hình bạn ra sao?","Bạn có dễ nói “không” không? Kể một lần bạn từ chối được một lời nhờ vả khó, và cảm giác của bạn trước – trong – sau khi nói.","Khi gặp chuyện buồn, bạn thường tìm đến ai hoặc làm gì đầu tiên? Điều đó nói gì về cách bạn tự chăm sóc mình?","“Sống ở hiện tại” khó hơn mọi người nghĩ: kể một lần bạn ngồi thiền hay đọc sách mà đầu vẫn chạy lung tung, và cách bạn kéo mình về.","Kể một lần bạn nhận ra mình đang “phóng đại sự việc” trong đầu — chuyện thật nhỏ hơn nhiều so với điều bạn tưởng tượng.","“Cuộc sống là một trò chơi — mình có quyền chọn win-win hay lose-win.” Kể một lựa chọn gần đây bạn chủ động chọn cách chơi của riêng mình.","Cảm xúc là yếu đuối hay là thông tin? Kể một lần bạn kìm nén cảm xúc và một lần bạn lắng nghe nó — kết quả khác nhau thế nào?","Một cuốn sách hay podcast đã thay đổi cách bạn nhìn bản thân: chia sẻ đúng MỘT ý bạn mang theo đến giờ và nó thể hiện trong đời sống của bạn ra sao.","Bạn đang học EQ, thiền hay một khóa phát triển bản thân? Kể một thay đổi nhỏ nhưng thật mà người xung quanh đã nhận ra ở bạn.","“Nhận diện – chấp nhận – buông – biết ơn – yêu thương”: chọn bước bạn thấy khó nhất và kể một tình huống bạn đang mắc ở bước đó.","“Làm siêng hay làm biếng đều phải trả giá.” Kể một việc nhỏ hằng ngày mà bạn đã chọn trả giá ngay thay vì trả sau.","Điều gì khiến bạn ghen tị với người khác gần đây nhất? Thay vì giấu đi, hãy “giải mã” xem sự ghen tị đó đang chỉ ra mong muốn thật nào của bạn.","Kể về một lần bạn thấy mình “mắc kẹt trong vòng lặp” cảm xúc — lặp lại cùng một phản ứng dù biết là không tốt — và điều đã giúp bạn phá vòng lặp.","“Cố gắng rất nhiều nhưng vẫn không tiến bộ”: kể một giai đoạn bạn cảm thấy như vậy và điều bạn đã thay đổi trong cách cố gắng.","“Thất bại là mẹ thành công” hay chỉ là lời an ủi? Kể một thất bại trong công việc và chứng minh quan điểm của bạn.","Làm sao để nâng cấp bản thân và gặp được người thầy đúng của mình? Chia sẻ một lần bạn “gặp đúng người” và điều bạn đã chuẩn bị trước đó.","Kể về một kỹ năng bạn tự học thành công khi đã đi làm: bạn bắt đầu thế nào, vượt qua giai đoạn chán nản ra sao, và kết quả đến giờ là gì?","Kể về một thói quen xấu bạn đã bỏ được (trì hoãn, thức khuya, lướt điện thoại vô thức…) và chiến lược cụ thể đã giúp bạn làm được.","Kể về lần bạn nhận một lời góp ý khó nghe nhất và cách bạn biến nó thành động lực để thay đổi.","Lần gần nhất bạn phải góp ý cho ai đó: kể lại bạn đã nói thế nào, rồi nói lại cách bạn muốn nói nếu được làm lại."]},{"group":"Pitching (Thuyết phục)","topics":["Nếu chỉ được dạy con MỘT kỹ năng sống trước năm 15 tuổi, bạn chọn gì? Thuyết phục cả nhóm trong 2 phút.","Trình bày cách chia ngân sách chi tiêu hằng tháng cho một gia đình 4 người sao cho vẫn có tiền tiết kiệm và tiền “tận hưởng”.","Lập “kế hoạch an toàn” cho gia đình khi có sự cố: cháy nổ, mất điện kéo dài, trẻ đi lạc — mỗi người trong nhà cần biết làm gì?","Thuyết phục cả nhà dành một buổi tối mỗi tuần “không thiết bị điện tử” để cùng làm một hoạt động chung — đề xuất hoạt động cụ thể và cách bắt đầu ngay tuần này.","Chăm sóc bố mẹ già khi mình bận rộn và ở xa: chia sẻ những cách thực tế để vẫn quan tâm đều đặn.","Hướng dẫn một người mới ra ở riêng những việc phải làm trong tuần đầu: hợp đồng thuê nhà, điện nước, an ninh, đi chợ.","Dạy con kỹ năng tự bảo vệ bản thân khi không có người lớn bên cạnh: bạn sẽ dạy những điều gì, và dạy bằng cách nào để con nhớ?","Bữa cơm gia đình có còn quan trọng trong thời đại ai cũng bận? Thuyết phục một gia đình “mỗi người ăn một giờ” quay lại ăn chung.","Quỹ dự phòng khẩn cấp cho gia đình: nên có bao nhiêu, để ở đâu, khi nào mới được dùng? Trình bày như tư vấn cho một cặp vợ chồng trẻ.","Lên kế hoạch một chuyến du lịch gia đình 3 ngày với ngân sách có hạn: điểm đến, lịch trình, mẹo tiết kiệm — trình bày để cả nhà “chốt” ngay.","Nếu được thêm một môn học “kỹ năng sống” vào chương trình phổ thông, bạn sẽ đề xuất nội dung gì? Trình bày như đang thuyết phục hội đồng nhà trường.","“Mỗi người một tốc độ”: vì sao so sánh tiến độ với người khác lại dễ khiến ta bỏ cuộc, và làm sao để chỉ so với chính mình hôm qua?","Stress có phải lúc nào cũng xấu? Phân biệt “stress tích cực” và “stress tiêu cực” bằng ví dụ đời thường.","Thiên nhiên có vai trò thế nào với sức khỏe của người sống ở thành phố? Đề xuất cách “mang thiên nhiên” vào cuộc sống bận rộn.","Công việc ngồi nhiều 8 tiếng mỗi ngày đang ảnh hưởng đến chúng ta ra sao? Đề xuất giải pháp mà người đi làm văn phòng làm được ngay.","Vì sao rất nhiều người bắt đầu tập luyện rồi bỏ dở sau vài tuần? Phân tích nguyên nhân và đề xuất cách vượt qua “giai đoạn dễ bỏ cuộc”.","Giới thiệu khóa học hoặc người thầy đã thay đổi bạn nhiều nhất — thuyết phục cả nhóm vì sao nên dành 1 buổi để bạn chia sẻ lại.","Giải thích hành trình khách hàng “Biết – Thích – Nhớ – Tin – Mua” bằng ví dụ một sản phẩm bạn đã mua gần đây.","Xây kênh viral hay tạo dựng niềm tin bền vững? Trình bày lựa chọn của bạn cho một người bạn sắp bắt đầu kinh doanh online.","Áp lực “phải thành công trước 30 tuổi” đến từ đâu, có hợp lý không? Nói với một người em 25 tuổi đang hoảng loạn vì “chưa có gì trong tay”.","Có nên dạy kỹ năng tài chính cá nhân ngay từ cấp 2, cấp 3? Thuyết phục một hiệu trưởng đưa vào chương trình ngoại khóa.","Chia sẻ phương pháp quản lý thời gian bạn đang dùng (to-do list, chia khung giờ, ưu tiên việc quan trọng…) và thuyết phục cả nhóm áp dụng thử trong 1 tuần.","Trình bày 3 mục tiêu phát triển bản thân của bạn cho năm tới: mục tiêu cụ thể là gì, đo bằng gì, và bước đầu tiên bạn làm ngay tháng này.","Thuyết phục một người chưa từng viết nhật ký thử dành 5 phút mỗi tối để viết và tự nhìn lại ngày của mình trong 21 ngày.","Thuyết trình 3 phút để xin tài trợ cho một hoạt động thiện nguyện: mở đầu ấn tượng, nêu tác động rõ ràng và lời kêu gọi cụ thể."]},{"group":"Debate (Tranh biện)","topics":["Vợ chồng nên giữ tiền chung một “quỹ” hay mỗi người tự quản lý thu nhập của mình? Nêu quan điểm và cách bạn thấy hợp lý nhất.","Sau khi lập gia đình, nên sống chung với bố mẹ hay ra ở riêng? Phân tích ưu – nhược điểm và lựa chọn của bạn.","Việc nhà nên chia đều 50–50 hay chia theo thế mạnh mỗi người? Đề xuất một cách chia giúp cả nhà không ai thấy thiệt.","Có nên cho trẻ dưới 12 tuổi dùng điện thoại riêng? Nếu có, bạn sẽ đặt những “luật chơi” nào?","Tiền tiêu vặt cho con: nên cho cố định hàng tuần hay cho theo công việc con làm? Trình bày cách dạy con giá trị đồng tiền.","Chọn trường cho con: gần nhà hay chất lượng cao nhưng xa? Liệt kê 3 tiêu chí quan trọng nhất với bạn và giải thích.","Khi con bị bắt nạt ở trường, bố mẹ nên can thiệp đến mức nào? Nêu quan điểm và các bước bạn sẽ làm.","Kỹ năng nấu ăn có nên là “kỹ năng bắt buộc” cho cả nam và nữ? Bảo vệ quan điểm của bạn trong 2 phút.","Sức khỏe luôn được gọi là “ưu tiên số 1”, nhưng vì sao hầu hết chúng ta vẫn xếp nó sau công việc? Nêu quan điểm của bạn.","Tập luyện vì sức khỏe hay vì ngoại hình — động lực nào bền vững hơn? Bảo vệ quan điểm của bạn.","Kỷ luật hay động lực: điều gì thực sự giúp con người duy trì một lối sống lành mạnh lâu dài?","Nên tin vào các chỉ số đo lường (cân nặng, nhịp tim, số bước chân) hay tin vào cảm nhận của cơ thể? Nêu quan điểm và lý do.","Tập thể dục một mình hay tập theo nhóm — cách nào giúp người ta kiên trì hơn? Phân tích cả hai mặt.","Chia sẻ thành quả tập luyện lên mạng xã hội: là truyền cảm hứng hay tạo áp lực cho người khác?","Giấc ngủ đang bị xem nhẹ trong cuộc sống hiện đại: bạn có đồng ý không? Đâu là “kẻ cắp giấc ngủ” lớn nhất hiện nay?","Ăn kiêng theo trào lưu (keto, nhịn ăn gián đoạn, detox…) có thật sự tốt? Nêu quan điểm của bạn về cách ăn uống lành mạnh.","Đầu tư nhiều tiền cho sức khỏe (thiết bị, thực phẩm, phòng tập) có xứng đáng không, hay sống khỏe không cần tốn kém?","Sức khỏe tinh thần có được quan tâm ngang bằng sức khỏe thể chất ở Việt Nam chưa? Điều gì cần thay đổi?","Thói quen nhỏ mỗi ngày hay thay đổi lớn một lần — đâu là con đường hiệu quả để sống khỏe hơn?","Người trẻ ngày nay khỏe hơn hay yếu hơn thế hệ bố mẹ? Lập luận bằng những thay đổi trong lối sống.","Có nên “ép” người thân thay đổi thói quen có hại (thức khuya, ít vận động, ăn uống thất thường)? Đâu là ranh giới giữa quan tâm và kiểm soát?","Nghỉ ngơi có phải là lười biếng? Bàn về văn hóa “bận rộn mới là giỏi” và giá trị của việc nghỉ ngơi đúng cách.","Hạnh phúc đến từ những điều lớn lao hay từ những khoảnh khắc nhỏ mỗi ngày? Nêu quan điểm và cách bạn “sống chậm” giữa nhịp sống nhanh.","Tranh luận: “Bằng cấp còn quan trọng trong thời đại này không?” — mỗi phe có đúng 2 phút, phản biện 1 phút.","Nên tiết kiệm để dành cho tương lai hay tận hưởng ở hiện tại? Trình bày cách bạn đang chia tiền mỗi tháng và lý do.","Làm việc tại công ty lớn có quy trình rõ ràng hay công ty nhỏ được làm nhiều việc? Tư vấn cho một sinh viên sắp ra trường.","Đọc sách giấy, nghe sách nói hay đọc bản tóm tắt — cách nào thật sự giúp con người phát triển bản thân?","Có nên bước ra khỏi vùng an toàn bằng mọi giá, hay đôi khi ở lại vùng an toàn cũng là một lựa chọn khôn ngoan?","Trào lưu “phát triển bản thân” đang giúp con người tiến bộ hay khiến nhiều người luôn cảm thấy mình chưa đủ tốt?"]},{"group":"Body Language (Ngôn ngữ cơ thể)","topics":["Kể về lần bạn chọn im lặng lắng nghe thay vì lên tiếng trong một cuộc thảo luận — bạn học được gì về mình từ vai người nghe?","Phản tư 1 phút cuối buổi: hôm nay khi nói trước mọi người, bạn phát hiện thêm điều gì về chính mình?","Hướng dẫn cả nhóm 3 kỹ năng sơ cứu ai cũng nên biết (bỏng, hóc dị vật, chảy máu) — rõ đến mức người nghe làm được ngay.","Đứng lên phát biểu 2 phút chúc mừng đám cưới một người bạn — giữ ánh mắt bao quát cả phòng, không cúi nhìn điện thoại hay giấy.","Phát biểu chia tay một đồng nghiệp nghỉ việc trong buổi liên hoan: nhắc một kỷ niệm chung và gửi lời chúc, với giọng nói ấm và chậm rãi.","Từ chối lời mời đi nhậu của sếp hoặc khách hàng: nói nguyên văn câu bạn dùng, kèm nét mặt và giọng điệu thân thiện để không mất lòng.","Nhận lỗi trước cả nhóm khi dự án bị trễ hạn: đứng thẳng, nhìn vào mọi người, nói rõ trách nhiệm của mình và hướng khắc phục.","Xoa dịu một khách hàng đang rất bực qua điện thoại: chú ý tốc độ nói, độ trầm của giọng và những khoảng lặng để lắng nghe.","Trả lời câu hỏi phỏng vấn “Điểm yếu lớn nhất của bạn là gì?” — ngồi thẳng, tay để mở, nói trung thực mà vẫn ghi điểm.","Bắt chuyện với một người lạ ở sự kiện kết nối và duy trì cuộc trò chuyện tự nhiên trong 3 phút: mở lời, đặt câu hỏi, lắng nghe bằng ánh mắt và cái gật đầu.","Sang nói chuyện với người hàng xóm hay gây ồn vào ban đêm: mở lời thế nào để giải quyết được việc mà vẫn giữ tình làng xóm?","Bạn bè hỏi vay tiền lần thứ hai khi lần trước chưa trả: nói lời từ chối rõ ràng nhưng tế nhị, với thái độ bình tĩnh.","Làm MC mở màn buổi họp lớp 10 năm: bước ra, chào hỏi và khuấy động không khí trong 2 phút bằng năng lượng và nụ cười.","Bị phản bác gay gắt trước mọi người trong cuộc họp: phản hồi bình tĩnh — giữ tư thế mở, giọng đều, không khoanh tay hay cao giọng.","Giới thiệu hai người bạn với nhau trong một bữa tiệc sao cho họ có ngay chủ đề để nói chuyện.","Báo tin không vui cho đội nhóm (cắt giảm thưởng, hủy dự án): mở lời thế nào cho rõ ràng mà vẫn giữ được tinh thần mọi người?","Xin phép sếp nghỉ đột xuất 3 ngày vì việc gia đình đúng lúc công việc đang gấp: trình bày thế nào để được đồng ý?","Một người bạn đang buồn tìm đến bạn: nên nói gì, không nên nói gì — và ngôn ngữ cơ thể nào cho thấy bạn đang thật sự lắng nghe?","Nhận lời khen trước đám đông: cảm ơn thế nào cho tự nhiên — ánh mắt, nụ cười, câu nói — không khiêm tốn quá mức mà cũng không tự mãn?","Kết thúc một cuộc điện thoại đang kéo dài quá lâu một cách lịch sự: nói nguyên văn câu bạn sẽ dùng.","Ấn tượng 30 giây đầu: diễn lại trước nhóm cách bạn bước vào phòng gặp đối tác mới — chào hỏi, bắt tay, giới thiệu bản thân."]}];

const CONFIG = {
  storagePrefix: 'qcd.v1.',
  spinMs: 1300,          // shuffle duration (ease-out)
  defaultName: 'Bộ mặc định',
};

/* ---------------- Utils ---------------- */
const Utils = {
  randInt(n) {
    if (n <= 0) return 0;
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  },
  escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  },
  prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  },
};

/* ---------------- Storage (namespaced, fail-safe) ---------------- */
const Storage = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(CONFIG.storagePrefix + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(CONFIG.storagePrefix + key, JSON.stringify(value)); } catch (_) {}
  },
  remove(key) {
    try { localStorage.removeItem(CONFIG.storagePrefix + key); } catch (_) {}
  },
};

/* ---------------- Data (normalize + validate) ---------------- */
const Data = {
  groups: [],   // [{ name, topics: [{id, title, groupName, groupIndex}] }]
  topics: [],   // flat list
  byId: new Map(),
  sourceName: CONFIG.defaultName,

  /** Validate raw JSON (same schema as topics.json) and normalize. Throws a friendly message on bad shape. */
  normalize(raw) {
    if (!Array.isArray(raw) || raw.length === 0) throw new Error('File phải là một mảng các nhóm mục tiêu.');
    const groups = [];
    const seen = new Set();
    raw.forEach((g, gi) => {
      if (!g || typeof g !== 'object' || typeof g.group !== 'string' || !g.group.trim()) {
        throw new Error(`Nhóm thứ ${gi + 1} thiếu tên ("group").`);
      }
      const name = g.group.trim();
      if (!Array.isArray(g.topics) || g.topics.length === 0) {
        throw new Error(`Nhóm "${name}" không có chủ đề nào.`);
      }
      const topics = g.topics.map((t, ti) => {
        const title = typeof t === 'string' ? t.trim()
          : (t && typeof t.title === 'string' ? t.title.trim() : '');
        if (!title) throw new Error(`Chủ đề thứ ${ti + 1} của nhóm "${name}" thiếu tiêu đề.`);
        // Stable id; duplicate titles stay independent via a suffix.
        let id = name + '::' + title;
        let n = 2;
        while (seen.has(id)) id = name + '::' + title + '::#' + (n++);
        seen.add(id);
        return { id, title, groupName: name, groupIndex: gi };
      });
      groups.push({ name, topics });
    });
    return groups;
  },

  apply(groups, sourceName) {
    this.groups = groups;
    this.topics = groups.flatMap((g) => g.topics);
    this.byId = new Map(this.topics.map((t) => [t.id, t]));
    this.sourceName = sourceName;
  },

  load() {
    const custom = Storage.get('customData', null);
    if (custom && custom.raw) {
      try {
        this.apply(this.normalize(custom.raw), custom.name || 'Bộ tùy chỉnh');
        return;
      } catch (_) { Storage.remove('customData'); /* corrupted -> fall back to default */ }
    }
    this.apply(this.normalize(EMBEDDED_DATA), CONFIG.defaultName);
  },

  usingCustom() { return this.sourceName !== CONFIG.defaultName; },
};

/* ---------------- State ---------------- */
const State = {
  spunIds: new Set(),   // topics already drawn (pruned to existing ids on load)
  goal: '',             // '' = all goals, otherwise a group name

  load() {
    const s = Storage.get('spunIds', []);
    const valid = new Set(Data.topics.map((t) => t.id));
    this.spunIds = new Set((Array.isArray(s) ? s : []).filter((id) => valid.has(id)));
    const g = Storage.get('goal', '');
    this.goal = (g === '' || Data.groups.some((x) => x.name === g)) ? g : '';
    this.save(); // persist the pruned/validated view
  },
  save() {
    Storage.set('spunIds', [...this.spunIds]);
    Storage.set('goal', this.goal);
  },
};

/* ---------------- Spin engine ---------------- */
const Spin = {
  running: false,
  current: null, // last drawn topic (not persisted: each visit starts on a clean stage)

  scopeTopics() {
    return State.goal
      ? Data.topics.filter((t) => t.groupName === State.goal)
      : Data.topics;
  },
  pool() {
    return this.scopeTopics().filter((t) => !State.spunIds.has(t.id));
  },

  /** Reset the no-repeat marks of the CURRENT scope only (other goals keep their progress). */
  resetScope() {
    const scope = new Set(this.scopeTopics().map((t) => t.id));
    State.spunIds = new Set([...State.spunIds].filter((id) => !scope.has(id)));
    State.save();
  },

  async run(opts = {}) {
    if (this.running || Data.topics.length === 0) return;

    let pool = this.pool();
    let restarted = false;
    if (pool.length === 0) {           // exhausted -> start a fresh round in this scope, then draw
      this.resetScope();
      pool = this.pool();
      restarted = true;
    }

    const chosen = pool[Utils.randInt(pool.length)];
    State.spunIds.add(chosen.id);
    this.current = chosen;
    State.save();

    this.running = true;
    UI.setSpinning(true);
    if (!opts.instant && !Utils.prefersReducedMotion()) {
      await this.animate(pool);
    }
    UI.setSpinning(false);
    this.running = false;

    UI.reveal(chosen, { restarted });
    UI.renderAll();
  },

  /** Slot-machine shuffle across the current pool, decelerating (ease-out). */
  animate(pool) {
    return new Promise((resolve) => {
      const start = Date.now();
      const step = () => {
        const elapsed = Date.now() - start;
        if (elapsed >= CONFIG.spinMs) { resolve(); return; }
        UI.setShuffleFrame(pool);
        const p = elapsed / CONFIG.spinMs;
        setTimeout(step, 50 + p * p * 240);
      };
      step();
    });
  },
};

/* ---------------- UI ---------------- */
const UI = {
  els: {},
  cache() {
    ['goals', 'stage', 'stage-label', 'topic', 'done-note',
     'spin-btn', 'counter', 'reset-spun', 'load-btn', 'default-btn', 'file-input', 'data-name']
      .forEach((id) => { this.els[id] = document.getElementById(id); });
  },

  showEmpty() {
    Spin.current = null;
    this.els['topic'].innerHTML = '<span class="empty-hint">bấm “Quay” để bốc một chủ đề 👇</span>';
    this.els['stage'].classList.remove('revealed', 'is-spinning', 'all-done');
  },

  renderGoals() {
    const all = Data.topics.length;
    const allLeft = Data.topics.filter((t) => !State.spunIds.has(t.id)).length;
    const pills = [
      { key: '', label: '✨ Tất cả', left: allLeft, total: all },
      ...Data.groups.map((g) => {
        const left = g.topics.filter((t) => !State.spunIds.has(t.id)).length;
        return { key: g.name, label: g.name, left, total: g.topics.length };
      }),
    ];
    this.els['goals'].innerHTML = pills.map((p) => `
      <button class="goal ${State.goal === p.key ? 'is-active' : ''}" type="button"
              role="tab" aria-selected="${State.goal === p.key}"
              data-goal="${Utils.escapeHtml(p.key)}">
        ${Utils.escapeHtml(p.label)}<small>${p.left}/${p.total}</small>
      </button>`).join('');
  },

  renderCounter() {
    const left = Spin.pool().length;
    const total = Spin.scopeTopics().length;
    this.els['counter'].textContent = left === 0
      ? `Đã quay hết ${total} chủ đề — bấm để bắt đầu vòng mới`
      : `Còn ${left}/${total} chủ đề chưa quay`;
    this.els['spin-btn'].textContent = left === 0 ? 'Quay lại từ đầu' : (Spin.current ? 'Quay tiếp' : 'Quay');
  },

  renderDataName() {
    this.els['data-name'].innerHTML = `Bộ chủ đề: <b>${Utils.escapeHtml(Data.sourceName)}</b>`;
    this.els['default-btn'].classList.toggle('hidden', !Data.usingCustom());
  },

  renderAll() {
    this.renderGoals();
    this.renderCounter();
    this.renderDataName();
  },

  setSpinning(on) {
    const stage = this.els['stage'];
    stage.classList.toggle('is-spinning', on);
    stage.classList.remove('all-done');
    this.els['spin-btn'].disabled = on;
    if (on) {
      stage.classList.remove('revealed');
      this.els['topic'].textContent = '…';
    }
  },

  setShuffleFrame(pool) {
    const list = pool && pool.length ? pool : Data.topics;
    const t = list[Utils.randInt(list.length)];
    this.els['topic'].textContent = t.title;
    this.els['stage-label'].textContent = t.groupName;
  },

  reveal(topic, { restarted } = {}) {
    const stage = this.els['stage'];
    this.els['topic'].textContent = topic.title;
    this.els['stage-label'].textContent = topic.groupName;
    stage.classList.remove('revealed');
    void stage.offsetWidth; // restart the pop animation
    stage.classList.add('revealed');
    if (restarted) this.toast('🔁 Đã quay hết lượt trước — bắt đầu vòng mới trong mục tiêu này!');
  },

  /** Shown when the current scope has no topics left to draw (on load / goal switch). */
  showExhaustedNote() {
    this.els['stage'].classList.add('all-done');
  },

  toast(msg, ms = 2400) {
    const prev = document.querySelector('.toast');
    if (prev) prev.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('out'), ms);
    setTimeout(() => el.remove(), ms + 450);
  },
};

/* ---------------- App ---------------- */
const App = {
  init() {
    UI.cache();
    Data.load();
    State.load();
    UI.showEmpty();
    UI.renderAll();
    if (Spin.pool().length === 0) UI.showExhaustedNote();
    this.wire();
  },

  wire() {
    UI.els['spin-btn'].addEventListener('click', () => Spin.run());

    // Goal pills: switching the goal clears the stage, never the progress.
    UI.els['goals'].addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-goal]');
      if (!btn || Spin.running) return;
      State.goal = btn.dataset.goal;
      State.save();
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
    });

    UI.els['reset-spun'].addEventListener('click', () => {
      if (State.spunIds.size === 0) { UI.toast('Chưa có chủ đề nào được đánh dấu đã quay.'); return; }
      const ok = window.confirm('Đặt lại toàn bộ dấu "đã quay"?\nMọi chủ đề sẽ có thể xuất hiện lại từ đầu.');
      if (!ok) return;
      State.spunIds.clear();
      State.save();
      UI.showEmpty();
      UI.renderAll();
      UI.toast('↺ Đã đặt lại — tất cả chủ đề sẵn sàng quay lại.');
    });

    UI.els['load-btn'].addEventListener('click', () => UI.els['file-input'].click());
    UI.els['file-input'].addEventListener('change', () => {
      const f = UI.els['file-input'].files[0];
      UI.els['file-input'].value = '';
      this.importFile(f);
    });

    UI.els['default-btn'].addEventListener('click', () => {
      Storage.remove('customData');
      Data.apply(Data.normalize(EMBEDDED_DATA), CONFIG.defaultName);
      State.load(); // prune spun ids against the default set
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
      UI.toast('↩︎ Đã quay về bộ chủ đề mặc định.');
    });

    // Space = spin (ignored while typing in a focused control).
    document.addEventListener('keydown', (ev) => {
      if (ev.code === 'Space' && !ev.repeat && ev.target === document.body) {
        ev.preventDefault();
        Spin.run();
      }
    });
  },

  async importFile(file) {
    if (!file) return;
    try {
      const raw = JSON.parse(await file.text());
      const groups = Data.normalize(raw); // throws with a friendly message on bad shape
      Data.apply(groups, file.name.replace(/\.json$/i, ''));
      Storage.set('customData', { name: Data.sourceName, raw });
      State.load(); // prune spun ids + goal against the new set; surviving progress is kept
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
      UI.toast(`✅ Đã nạp "${Data.sourceName}": ${Data.groups.length} mục tiêu · ${Data.topics.length} chủ đề.`);
    } catch (e) {
      const detail = e && e.message ? e.message : 'Không đọc được file.';
      UI.toast(`❌ File không hợp lệ — giữ nguyên bộ chủ đề hiện tại.\n${detail}`, 3600);
    }
  },
};

/* Internal debug/test handle (not a public API). */
window.__QCD__ = { CONFIG, Utils, Storage, Data, State, Spin, UI, App };

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.init());
} else {
  App.init();
}
</script>
</body>
</html>
