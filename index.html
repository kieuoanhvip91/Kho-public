<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quay Chủ Đề</title>
<meta name="description" content="Bốc ngẫu nhiên chủ đề luyện nói theo mục tiêu — không lặp lại cho đến khi quay hết.">
<style>
/* ============================================================
   Quay Chủ Đề — single-file topic spinner
   Dark, warm, editorial look. No build step, no dependencies.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Prata&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');

:root {
  --bg: #100d0a;             /* warm near-black */
  --bg-soft: #17130e;
  --surface: #1d1812;
  --surface-2: #272017;
  --text: #f4eee3;
  --muted: #9d9183;
  --accent: #e8a33b;         /* spotlight amber */
  --accent-strong: #f0b45c;
  --accent-ink: #2a1f0c;
  --border: #322a1f;
  --radius: 12px;            /* blocks/cards max 12px */
  --radius-btn: 10px;        /* buttons 10px */
  --font-display: "Prata", "Times New Roman", Georgia, serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --speed: 0.25s;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1000px 520px at 50% -12%, #241b10 0%, transparent 62%),
    radial-gradient(760px 420px at 85% 110%, #1a140d 0%, transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  min-height: 100dvh;
  overflow-x: clip;
}

/* ---------- Header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 20px;
}
.brand { font-weight: 700; letter-spacing: 0.02em; font-size: 0.95rem; color: var(--muted); }
.brand b { color: var(--text); }
#reset-spun {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font: inherit; font-size: 0.78rem; padding: 7px 12px; border-radius: var(--radius-btn);
  cursor: pointer; transition: color var(--speed), border-color var(--speed);
  white-space: nowrap;
}
#reset-spun:hover { color: var(--text); border-color: var(--muted); }

/* ---------- Main ---------- */
main {
  flex: 1;
  width: min(860px, 100%);
  margin: 0 auto;
  padding: 10px 20px 28px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 5.4vw, 3rem);
  margin: 14px 0 6px;
  letter-spacing: 0.01em;
}
.tagline { color: var(--muted); margin: 0 0 22px; font-size: 0.95rem; }

/* ---------- Goal pills ---------- */
.goals {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 8px;
}
.goal {
  font: inherit; font-size: 0.84rem; font-weight: 600;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;            /* pill chips ≤48px tall: allowed */
  padding: 9px 16px;
  cursor: pointer;
  transition: all var(--speed);
  white-space: nowrap;
}
.goal:hover { color: var(--text); border-color: var(--muted); transform: translateY(-1px); }
.goal.is-active {
  color: var(--accent-ink);
  background: linear-gradient(180deg, var(--accent-strong), var(--accent));
  border-color: transparent;
  box-shadow: 0 6px 20px rgba(232, 163, 59, 0.28);
}
.goal small { font-weight: 500; opacity: 0.75; margin-left: 5px; }

/* ---------- Stage ---------- */
.stage {
  flex: 1;
  width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 44vh;
  padding: 18px 6px;
}
.stage-label {
  font-size: 0.74rem; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.topic {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.7rem, 5.8vw, 3.3rem);
  line-height: 1.22;
  max-width: 20ch;
  margin: 0;
  min-height: 1.2em;
  overflow-wrap: break-word;
}
.topic.is-long { font-size: clamp(1.35rem, 3.6vw, 2.25rem); max-width: 30ch; line-height: 1.3; }
.topic.is-xlong { font-size: clamp(1.2rem, 3vw, 1.85rem); max-width: 34ch; line-height: 1.35; }
.stage.revealed .stage-label,
.stage.is-spinning .stage-label { opacity: 1; transform: none; }
.stage.is-spinning .topic { filter: blur(1.5px); opacity: 0.6; }
.stage.revealed .topic { animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes pop {
  from { transform: scale(0.96); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.empty-hint {
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 400;
}
.done-note {
  margin-top: 14px; color: var(--muted); font-size: 0.9rem;
  display: none;
}
.stage.all-done .done-note { display: block; }

/* ---------- Action bar ---------- */
.actions {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-bottom: 6px;
  width: 100%;
}
#spin-btn {
  font: inherit; font-weight: 700; font-size: 1.05rem;
  color: var(--accent-ink);
  background: linear-gradient(180deg, var(--accent-strong), var(--accent));
  border: none; border-radius: var(--radius-btn);
  padding: 15px 44px;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(232, 163, 59, 0.3);
  transition: transform var(--speed), box-shadow var(--speed), filter var(--speed);
}
#spin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(232, 163, 59, 0.38); }
#spin-btn:active { transform: scale(0.98); }
#spin-btn:disabled { filter: saturate(0.4) brightness(0.8); cursor: wait; transform: none; }
.counter { color: var(--muted); font-size: 0.85rem; }
.round { color: var(--muted); font-size: 0.78rem; opacity: 0.85; max-width: 92vw; }
.kbd-hint { color: var(--muted); font-size: 0.78rem; opacity: 0.8; }
.kbd-hint kbd {
  font-family: inherit; font-size: 0.72rem;
  border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 6px; padding: 1px 7px; margin: 0 2px;
  background: var(--surface);
}

/* ---------- Footer (data tools) ---------- */
footer {
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center;
  padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg-soft);
}
.linkish {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 0.82rem; cursor: pointer;
  padding: 6px 2px; text-decoration: none;
  transition: color var(--speed);
}
.linkish:hover { color: var(--text); }
.linkish.hidden { display: none; }
#data-name { color: var(--muted); font-size: 0.82rem; }
#data-name b { color: var(--text); font-weight: 600; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 18px; font-size: 0.88rem;
  max-width: min(92vw, 460px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
  white-space: pre-line; text-align: center;
  animation: toast-in 0.3s ease;
  z-index: 60;
}
.toast.out { opacity: 0; transition: opacity 0.4s ease; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ---------- Mobile ---------- */
@media (max-width: 480px) {
  main { padding: 6px 16px 20px; }
  .stage { min-height: 32vh; padding: 12px 4px; }
  #spin-btn { width: 100%; padding: 15px 20px; }
  .kbd-hint { display: none; }
  .round { font-size: 0.7rem; line-height: 1.5; padding-bottom: 4px; }
  .actions { gap: 6px; }
}

@media (max-width: 480px) and (max-height: 720px) {
  h1 { font-size: 1.7rem; margin: 4px 0 4px; }
  .tagline { display: none; }
  .goal { padding: 7px 13px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <span class="brand">🎯 <b>Quay Chủ Đề</b></span>
  <button id="reset-spun" type="button" title="Xóa dấu các chủ đề đã quay">↺ Đặt lại đã quay</button>
</header>

<main>
  <h1>Hôm nay nói gì?</h1>
  <p class="tagline">Chọn mục tiêu rồi bấm quay — mỗi chủ đề chỉ xuất hiện một lần cho đến khi quay hết.</p>

  <div class="goals" id="goals" role="tablist" aria-label="Mục tiêu luyện tập"></div>

  <section class="stage" id="stage" aria-live="polite">
    <span class="stage-label" id="stage-label">Chủ đề của bạn</span>
    <h2 class="topic" id="topic"></h2>
    <p class="done-note" id="done-note">🎉 Bạn đã quay hết chủ đề trong mục tiêu này.</p>
  </section>

  <div class="actions">
    <button id="spin-btn" type="button">Quay</button>
    <span class="counter" id="counter"></span>
    <span class="round" id="round"></span>
    <span class="kbd-hint">nhấn <kbd>space</kbd> để quay</span>
  </div>
</main>

<footer>
  <span id="data-name"></span>
  <button class="linkish" id="load-btn" type="button">📂 Nạp bộ chủ đề khác (JSON)</button>
  <button class="linkish hidden" id="default-btn" type="button">↩︎ Về bộ mặc định</button>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
</footer>

<script>
'use strict';
/* ============================================================
   Data — embedded at build time from topics.json.
   Schema: [ { group, topics: [ {title, ...} | "title" ] } ]
   (extra fields like "skills"/"questions" are accepted and ignored,
    so the same topics.json also works for the Weekly Speaking app)
   ============================================================ */
const EMBEDDED_DATA = [{"group":"Storytelling (Kể chuyện)","topics":[{"title":"Kể về một niềm tin tiêu cực bạn từng mang (“tôi phải hoàn hảo”, “tôi phải làm mọi người hài lòng”) và khoảnh khắc bạn nhận ra nó đang điều khiển mình.","theme":"Nội tâm"},{"title":"Chọn 1 dòng trong bảng chuyển hóa niềm tin của nhóm, kể chuyện thật của bạn theo 3 nấc: niềm tin tiêu cực → niềm tin cân bằng → niềm tin nuôi dưỡng.","theme":"Nội tâm"},{"title":"Trong 3 nhóm niềm tin về bản thân — Năng lực, Đáng được yêu, Giá trị — nhóm nào bạn thấy mình “yếu” nhất? Kể một tình huống tuần này cho thấy điều đó.","theme":"Nội tâm"},{"title":"“Tảng băng chìm”: kể một hành vi bạn hay lặp lại (trì hoãn, cả nể, nổi nóng) rồi đào xuống phần chìm — cảm xúc và niềm tin nào nằm bên dưới?","theme":"Nội tâm"},{"title":"Bạn từng cả nể hay tin người đến mức chịu thiệt? Kể lại, và nói vì sao đến giờ bạn vẫn chọn (hoặc thôi) tin người.","theme":"Quan hệ & ứng xử"},{"title":"Một lời khen hay lời chê từ nhiều năm trước vẫn còn “vang” trong đầu bạn đến hôm nay: đó là câu gì, và nó đã định hình bạn ra sao?","theme":"Nội tâm"},{"title":"Bạn có dễ nói “không” không? Kể một lần bạn từ chối được một lời nhờ vả khó, và cảm giác của bạn trước – trong – sau khi nói.","theme":"Quan hệ & ứng xử"},{"title":"Khi gặp chuyện buồn, bạn thường tìm đến ai hoặc làm gì đầu tiên? Điều đó nói gì về cách bạn tự chăm sóc mình?","theme":"Nội tâm"},{"title":"“Sống ở hiện tại” khó hơn mọi người nghĩ: kể một lần bạn ngồi thiền hay đọc sách mà đầu vẫn chạy lung tung, và cách bạn kéo mình về.","theme":"Nội tâm"},{"title":"Kể một lần bạn nhận ra mình đang “phóng đại sự việc” trong đầu — chuyện thật nhỏ hơn nhiều so với điều bạn tưởng tượng.","theme":"Nội tâm"},{"title":"“Cuộc sống là một trò chơi — mình có quyền chọn win-win hay lose-win.” Kể một lựa chọn gần đây bạn chủ động chọn cách chơi của riêng mình.","theme":"Nội tâm"},{"title":"Cảm xúc là yếu đuối hay là thông tin? Kể một lần bạn kìm nén cảm xúc và một lần bạn lắng nghe nó — kết quả khác nhau thế nào?","theme":"Nội tâm"},{"title":"Một cuốn sách hay podcast đã thay đổi cách bạn nhìn bản thân: chia sẻ đúng MỘT ý bạn mang theo đến giờ và nó thể hiện trong đời sống của bạn ra sao.","theme":"Phát triển bản thân"},{"title":"Bạn đang học EQ, thiền hay một khóa phát triển bản thân? Kể một thay đổi nhỏ nhưng thật mà người xung quanh đã nhận ra ở bạn.","theme":"Phát triển bản thân"},{"title":"“Nhận diện – chấp nhận – buông – biết ơn – yêu thương”: chọn bước bạn thấy khó nhất và kể một tình huống bạn đang mắc ở bước đó.","theme":"Nội tâm"},{"title":"“Làm siêng hay làm biếng đều phải trả giá.” Kể một việc nhỏ hằng ngày mà bạn đã chọn trả giá ngay thay vì trả sau.","theme":"Phát triển bản thân"},{"title":"Điều gì khiến bạn ghen tị với người khác gần đây nhất? Thay vì giấu đi, hãy “giải mã” xem sự ghen tị đó đang chỉ ra mong muốn thật nào của bạn.","theme":"Nội tâm"},{"title":"Kể về một lần bạn thấy mình “mắc kẹt trong vòng lặp” cảm xúc — lặp lại cùng một phản ứng dù biết là không tốt — và điều đã giúp bạn phá vòng lặp.","theme":"Nội tâm"},{"title":"“Cố gắng rất nhiều nhưng vẫn không tiến bộ”: kể một giai đoạn bạn cảm thấy như vậy và điều bạn đã thay đổi trong cách cố gắng.","theme":"Phát triển bản thân"},{"title":"“Thất bại là mẹ thành công” hay chỉ là lời an ủi? Kể một thất bại trong công việc và chứng minh quan điểm của bạn.","theme":"Công việc"},{"title":"Làm sao để nâng cấp bản thân và gặp được người thầy đúng của mình? Chia sẻ một lần bạn “gặp đúng người” và điều bạn đã chuẩn bị trước đó.","theme":"Phát triển bản thân"},{"title":"Kể về một kỹ năng bạn tự học thành công khi đã đi làm: bạn bắt đầu thế nào, vượt qua giai đoạn chán nản ra sao, và kết quả đến giờ là gì?","theme":"Phát triển bản thân"},{"title":"Kể về một thói quen xấu bạn đã bỏ được (trì hoãn, thức khuya, lướt điện thoại vô thức…) và chiến lược cụ thể đã giúp bạn làm được.","theme":"Phát triển bản thân"},{"title":"Kể về lần bạn nhận một lời góp ý khó nghe nhất và cách bạn biến nó thành động lực để thay đổi.","theme":"Phát triển bản thân"},{"title":"Lần gần nhất bạn phải góp ý cho ai đó: kể lại bạn đã nói thế nào, rồi nói lại cách bạn muốn nói nếu được làm lại.","theme":"Quan hệ & ứng xử"},{"title":"Kể về lần bạn chọn im lặng lắng nghe thay vì lên tiếng trong một cuộc thảo luận — bạn học được gì về mình từ vai người nghe?","theme":"Quan hệ & ứng xử"},{"title":"Kể về thầy cô giáo đã để lại dấu ấn sâu nhất trong những năm đi học của bạn — qua một khoảnh khắc cụ thể mà bạn nhớ mãi.","theme":"Kỷ niệm"},{"title":"Kể về ngày đầu tiên đi làm của bạn: từ lúc thức dậy, bước vào nơi làm việc, cho đến khi kết thúc ngày hôm đó.","theme":"Kỷ niệm"},{"title":"Kể về một chuyến đi đã thay đổi cách bạn nhìn cuộc sống: bạn đi đâu, gặp ai, và điều gì khiến bạn trở về khác đi.","theme":"Kỷ niệm"},{"title":"Kể về một lần bạn được một người lạ giúp đỡ (hoặc bạn giúp một người lạ) — và điều đó để lại gì trong bạn.","theme":"Kỷ niệm"},{"title":"Kể câu chuyện đằng sau một món đồ bạn đã giữ gìn nhiều năm mà không nỡ bỏ đi.","theme":"Kỷ niệm"},{"title":"Kể về một lần bạn phải chọn giữa hai con đường quan trọng: bạn đã cân nhắc thế nào, chọn gì, và nhìn lại thấy ra sao?","theme":"Kỷ niệm"},{"title":"Kể một kỷ niệm với ông bà hoặc một người lớn tuổi trong gia đình khiến bạn nhớ mãi.","theme":"Gia đình"},{"title":"Kể về một lần bạn vượt qua nỗi sợ của chính mình — từ lúc run sợ, giây phút quyết định, đến khi làm được.","theme":"Kỷ niệm"},{"title":"Kể về một lần mọi thứ đi sai kế hoạch (một chuyến đi, một sự kiện, một dự án) nhưng kết quả lại tốt đẹp bất ngờ.","theme":"Kỷ niệm"},{"title":"Kể về khoảnh khắc bạn tự hào nhất về bản thân trong năm nay, và điều gì đã giúp bạn làm được.","theme":"Kỷ niệm"}]},{"group":"Pitching (Thuyết phục)","topics":[{"title":"Nếu chỉ được dạy con MỘT kỹ năng sống trước năm 15 tuổi, bạn chọn gì? Thuyết phục cả nhóm trong 2 phút.","theme":"Gia đình"},{"title":"Trình bày cách chia ngân sách chi tiêu hằng tháng cho một gia đình 4 người sao cho vẫn có tiền tiết kiệm và tiền “tận hưởng”.","theme":"Tiền bạc"},{"title":"Lập “kế hoạch an toàn” cho gia đình khi có sự cố: cháy nổ, mất điện kéo dài, trẻ đi lạc — mỗi người trong nhà cần biết làm gì?","theme":"Kỹ năng sống"},{"title":"Thuyết phục cả nhà dành một buổi tối mỗi tuần “không thiết bị điện tử” để cùng làm một hoạt động chung — đề xuất hoạt động cụ thể và cách bắt đầu ngay tuần này.","theme":"Gia đình"},{"title":"Chăm sóc bố mẹ già khi mình bận rộn và ở xa: chia sẻ những cách thực tế để vẫn quan tâm đều đặn.","theme":"Gia đình"},{"title":"Hướng dẫn một người mới ra ở riêng những việc phải làm trong tuần đầu: hợp đồng thuê nhà, điện nước, an ninh, đi chợ.","theme":"Kỹ năng sống"},{"title":"Dạy con kỹ năng tự bảo vệ bản thân khi không có người lớn bên cạnh: bạn sẽ dạy những điều gì, và dạy bằng cách nào để con nhớ?","theme":"Gia đình"},{"title":"Bữa cơm gia đình có còn quan trọng trong thời đại ai cũng bận? Thuyết phục một gia đình “mỗi người ăn một giờ” quay lại ăn chung.","theme":"Gia đình"},{"title":"Quỹ dự phòng khẩn cấp cho gia đình: nên có bao nhiêu, để ở đâu, khi nào mới được dùng? Trình bày như tư vấn cho một cặp vợ chồng trẻ.","theme":"Tiền bạc"},{"title":"Lên kế hoạch một chuyến du lịch gia đình 3 ngày với ngân sách có hạn: điểm đến, lịch trình, mẹo tiết kiệm — trình bày để cả nhà “chốt” ngay.","theme":"Gia đình"},{"title":"Nếu được thêm một môn học “kỹ năng sống” vào chương trình phổ thông, bạn sẽ đề xuất nội dung gì? Trình bày như đang thuyết phục hội đồng nhà trường.","theme":"Kỹ năng sống"},{"title":"“Mỗi người một tốc độ”: vì sao so sánh tiến độ với người khác lại dễ khiến ta bỏ cuộc, và làm sao để chỉ so với chính mình hôm qua?","theme":"Nội tâm"},{"title":"Stress có phải lúc nào cũng xấu? Phân biệt “stress tích cực” và “stress tiêu cực” bằng ví dụ đời thường.","theme":"Sức khỏe"},{"title":"Thiên nhiên có vai trò thế nào với sức khỏe của người sống ở thành phố? Đề xuất cách “mang thiên nhiên” vào cuộc sống bận rộn.","theme":"Sức khỏe"},{"title":"Công việc ngồi nhiều 8 tiếng mỗi ngày đang ảnh hưởng đến chúng ta ra sao? Đề xuất giải pháp mà người đi làm văn phòng làm được ngay.","theme":"Sức khỏe"},{"title":"Vì sao rất nhiều người bắt đầu tập luyện rồi bỏ dở sau vài tuần? Phân tích nguyên nhân và đề xuất cách vượt qua “giai đoạn dễ bỏ cuộc”.","theme":"Sức khỏe"},{"title":"Giới thiệu khóa học hoặc người thầy đã thay đổi bạn nhiều nhất — thuyết phục cả nhóm vì sao nên dành 1 buổi để bạn chia sẻ lại.","theme":"Phát triển bản thân"},{"title":"Giải thích hành trình khách hàng “Biết – Thích – Nhớ – Tin – Mua” bằng ví dụ một sản phẩm bạn đã mua gần đây.","theme":"Công việc"},{"title":"Xây kênh viral hay tạo dựng niềm tin bền vững? Trình bày lựa chọn của bạn cho một người bạn sắp bắt đầu kinh doanh online.","theme":"Công việc"},{"title":"Áp lực “phải thành công trước 30 tuổi” đến từ đâu, có hợp lý không? Nói với một người em 25 tuổi đang hoảng loạn vì “chưa có gì trong tay”.","theme":"Công việc"},{"title":"Có nên dạy kỹ năng tài chính cá nhân ngay từ cấp 2, cấp 3? Thuyết phục một hiệu trưởng đưa vào chương trình ngoại khóa.","theme":"Tiền bạc"},{"title":"Chia sẻ phương pháp quản lý thời gian bạn đang dùng (to-do list, chia khung giờ, ưu tiên việc quan trọng…) và thuyết phục cả nhóm áp dụng thử trong 1 tuần.","theme":"Phát triển bản thân"},{"title":"Trình bày 3 mục tiêu phát triển bản thân của bạn cho năm tới: mục tiêu cụ thể là gì, đo bằng gì, và bước đầu tiên bạn làm ngay tháng này.","theme":"Phát triển bản thân"},{"title":"Thuyết phục một người chưa từng viết nhật ký thử dành 5 phút mỗi tối để viết và tự nhìn lại ngày của mình trong 21 ngày.","theme":"Phát triển bản thân"},{"title":"Thuyết trình 3 phút để xin tài trợ cho một hoạt động thiện nguyện: mở đầu ấn tượng, nêu tác động rõ ràng và lời kêu gọi cụ thể.","theme":"Quan hệ & ứng xử"}]},{"group":"Debate (Tranh biện)","topics":[{"title":"Vợ chồng nên giữ tiền chung một “quỹ” hay mỗi người tự quản lý thu nhập của mình? Nêu quan điểm và cách bạn thấy hợp lý nhất.","theme":" const CONFIG = {
  storagePrefix: 'qcd.v1.',
  spinMs: 1300,          // shuffle duration (ease-out)
  defaultName: 'Bộ mặc định',
  themeGap: 3,           // a content area may not repeat within this many previous draws (=> 4 in a row are all different)
};

/* ---------------- Utils ---------------- */
const Utils = {
  randInt(n) {
    if (n <= 0) return 0;
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  },
  escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  },
  prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  },
};

/* ---------------- Storage (namespaced, fail-safe) ---------------- */
const Storage = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(CONFIG.storagePrefix + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(CONFIG.storagePrefix + key, JSON.stringify(value)); } catch (_) {}
  },
  remove(key) {
    try { localStorage.removeItem(CONFIG.storagePrefix + key); } catch (_) {}
  },
};

/* ---------------- Data (normalize + validate) ---------------- */
const Data = {
  groups: [],   // [{ name, topics: [{id, title, groupName, groupIndex}] }]
  topics: [],   // flat list
  byId: new Map(),
  sourceName: CONFIG.defaultName,

  /** Validate raw JSON (same schema as topics.json) and normalize. Throws a friendly message on bad shape. */
  normalize(raw) {
    if (!Array.isArray(raw) || raw.length === 0) throw new Error('File phải là một mảng các nhóm mục tiêu.');
    const groups = [];
    const seen = new Set();
    raw.forEach((g, gi) => {
      if (!g || typeof g !== 'object' || typeof g.group !== 'string' || !g.group.trim()) {
        throw new Error(`Nhóm thứ ${gi + 1} thiếu tên ("group").`);
      }
      const name = g.group.trim();
      if (!Array.isArray(g.topics) || g.topics.length === 0) {
        throw new Error(`Nhóm "${name}" không có chủ đề nào.`);
      }
      const topics = g.topics.map((t, ti) => {
        const title = typeof t === 'string' ? t.trim()
          : (t && typeof t.title === 'string' ? t.title.trim() : '');
        if (!title) throw new Error(`Chủ đề thứ ${ti + 1} của nhóm "${name}" thiếu tiêu đề.`);
        // Stable id; duplicate titles stay independent via a suffix.
        let id = name + '::' + title;
        let n = 2;
        while (seen.has(id)) id = name + '::' + title + '::#' + (n++);
        seen.add(id);
        const theme = t && typeof t === 'object' && typeof t.theme === 'string' ? t.theme.trim() : '';
        return { id, title, theme, groupName: name, groupIndex: gi };
      });
      groups.push({ name, topics });
    });
    return groups;
  },

  apply(groups, sourceName) {
    this.groups = groups;
    this.topics = groups.flatMap((g) => g.topics);
    this.byId = new Map(this.topics.map((t) => [t.id, t]));
    this.sourceName = sourceName;
  },

  load() {
    const custom = Storage.get('customData', null);
    if (custom && custom.raw) {
      try {
        this.apply(this.normalize(custom.raw), custom.name || 'Bộ tùy chỉnh');
        return;
      } catch (_) { Storage.remove('customData'); /* corrupted -> fall back to default */ }
    }
    this.apply(this.normalize(EMBEDDED_DATA), CONFIG.defaultName);
  },

  usingCustom() { return this.sourceName !== CONFIG.defaultName; },
};

/* ---------------- State ---------------- */
const State = {
  spunIds: new Set(),   // topics already drawn (pruned to existing ids on load)
  goal: '',             // '' = all goals, otherwise a group name
  round: [],            // groups already drawn in the current rotation round ("Tất cả" mode)
  recent: [],           // last draws [{ group, theme }] — used to space out similar content

  load() {
    const s = Storage.get('spunIds', []);
    const valid = new Set(Data.topics.map((t) => t.id));
    this.spunIds = new Set((Array.isArray(s) ? s : []).filter((id) => valid.has(id)));
    const g = Storage.get('goal', '');
    this.goal = (g === '' || Data.groups.some((x) => x.name === g)) ? g : '';
    const names = new Set(Data.groups.map((x) => x.name));
    const r = Storage.get('round', []);
    this.round = (Array.isArray(r) ? r : []).filter((n) => names.has(n));
    const rc = Storage.get('recent', []);
    this.recent = (Array.isArray(rc) ? rc : [])
      .filter((x) => x && names.has(x.group))
      .map((x) => ({ group: x.group, theme: typeof x.theme === 'string' ? x.theme : '' }))
      .slice(-CONFIG.themeGap);
    this.save(); // persist the pruned/validated view
  },
  save() {
    Storage.set('spunIds', [...this.spunIds]);
    Storage.set('goal', this.goal);
    Storage.set('round', this.round);
    Storage.set('recent', this.recent);
  },
  clearRotation() {
    this.round = [];
    this.recent = [];
  },
};

/* ---------------- Spin engine ---------------- */
const Spin = {
  running: false,
  current: null, // last drawn topic (not persisted: each visit starts on a clean stage)

  scopeTopics() {
    return State.goal
      ? Data.topics.filter((t) => t.groupName === State.goal)
      : Data.topics;
  },
  pool() {
    return this.scopeTopics().filter((t) => !State.spunIds.has(t.id));
  },

  /** Topics whose content area was not used in the last `gap` draws. */
  themeFiltered(list, gap) {
    if (gap <= 0) return list;
    const banned = new Set(State.recent.slice(-gap).map((r) => r.theme).filter(Boolean));
    return list.filter((t) => !t.theme || !banned.has(t.theme));
  },

  /**
   * Choose the next topic.
   * - "Tất cả": groups take turns — every group (that still has topics) is drawn once
   *   per round, in random order, and a new round never starts with the group just drawn.
   * - Content spacing: avoid content areas used in the last CONFIG.themeGap draws;
   *   the window shrinks only when nothing else is left.
   */
  pick(pool) {
    let groupPool = pool;
    let restartedGroup = null;
    if (!State.goal) {
      // All groups always take part; a group that ran out simply starts its own list again.
      const all = Data.groups.map((g) => g.name);
      const groupTopics = (g) => {
        const left = pool.filter((t) => t.groupName === g);
        return left.length ? left : Data.topics.filter((t) => t.groupName === g);
      };
      let eligible = all.filter((g) => !State.round.includes(g));
      if (!eligible.length) {
        State.round = [];
        const last = State.recent.length ? State.recent[State.recent.length - 1].group : null;
        eligible = all.length > 1 ? all.filter((g) => g !== last) : all;
      }
      // Look ahead within the round: only pick (group, content area) pairs that still leave
      // every remaining group of this round a content area outside the spacing window.
      const gap = CONFIG.themeGap;
      const themesOf = (g, recentThemes) => {
        const banned = new Set(recentThemes.slice(-gap).filter(Boolean));
        return [...new Set(groupTopics(g).map((t) => t.theme))].filter((th) => !th || !banned.has(th));
      };
      const feasible = (groups, recentThemes) => !groups.length || groups.some((g) =>
        themesOf(g, recentThemes).some((th) => feasible(groups.filter((x) => x !== g), [...recentThemes, th])));
      const recentThemes = State.recent.map((r) => r.theme);
      const okThemes = {};
      for (const g of eligible) {
        const rest = eligible.filter((x) => x !== g);
        okThemes[g] = themesOf(g, recentThemes).filter((th) => feasible(rest, [...recentThemes, th]));
      }
      const safe = eligible.filter((g) => okThemes[g].length);
      // Fallback: groups that at least honour the gap themselves, else any eligible group.
      const roomy = eligible.filter((g) => themesOf(g, recentThemes).length);
      const choices = safe.length ? safe : (roomy.length ? roomy : eligible);
      const group = choices[Utils.randInt(choices.length)];
      groupPool = pool.filter((t) => t.groupName === group);
      if (safe.length && groupPool.length) {
        const allowed = new Set(okThemes[group]);
        const narrowed = groupPool.filter((t) => allowed.has(t.theme));
        if (narrowed.length) groupPool = narrowed;
      }
      if (!groupPool.length) {                 // this group is used up -> restart just this group
        const ids = new Set(Data.topics.filter((t) => t.groupName === group).map((t) => t.id));
        State.spunIds = new Set([...State.spunIds].filter((id) => !ids.has(id)));
        groupPool = Data.topics.filter((t) => t.groupName === group);
        if (safe.length) {
          const allowed = new Set(okThemes[group]);
          const narrowed = groupPool.filter((t) => allowed.has(t.theme));
          if (narrowed.length) groupPool = narrowed;
        }
        restartedGroup = group;
      }
    }
    let candidates = groupPool;
    for (let gap = CONFIG.themeGap; gap >= 0; gap--) {
      const c = this.themeFiltered(groupPool, gap);
      if (c.length) { candidates = c; break; }
    }
    return { chosen: candidates[Utils.randInt(candidates.length)], candidates, restartedGroup };
  },

  /** Reset the no-repeat marks of the CURRENT scope only (other goals keep their progress). */
  resetScope() {
    const scope = new Set(this.scopeTopics().map((t) => t.id));
    State.spunIds = new Set([...State.spunIds].filter((id) => !scope.has(id)));
    State.save();
  },

  async run(opts = {}) {
    if (this.running || Data.topics.length === 0) return;

    let pool = this.pool();
    let restarted = false;
    if (pool.length === 0 && State.goal) { // single group exhausted -> fresh round of that group
      this.resetScope();
      pool = this.pool();
      restarted = true;
    }

    const { chosen, candidates, restartedGroup } = this.pick(pool);
    if (restartedGroup) restarted = restartedGroup;
    State.spunIds.add(chosen.id);
    if (!State.goal) State.round.push(chosen.groupName);
    State.recent.push({ group: chosen.groupName, theme: chosen.theme });
    State.recent = State.recent.slice(-CONFIG.themeGap);
    this.current = chosen;
    State.save();

    this.running = true;
    UI.setSpinning(true);
    if (!opts.instant && !Utils.prefersReducedMotion()) {
      await this.animate(candidates);
    }
    UI.setSpinning(false);
    this.running = false;

    UI.reveal(chosen, { restarted });
    UI.renderAll();
  },

  /** Slot-machine shuffle across the current pool, decelerating (ease-out). */
  animate(pool) {
    return new Promise((resolve) => {
      const start = Date.now();
      const step = () => {
        const elapsed = Date.now() - start;
        if (elapsed >= CONFIG.spinMs) { resolve(); return; }
        UI.setShuffleFrame(pool);
        const p = elapsed / CONFIG.spinMs;
        setTimeout(step, 50 + p * p * 240);
      };
      step();
    });
  },
};

/* ---------------- UI ---------------- */
const UI = {
  els: {},
  cache() {
    ['goals', 'stage', 'stage-label', 'topic', 'done-note',
     'spin-btn', 'counter', 'round', 'reset-spun', 'load-btn', 'default-btn', 'file-input', 'data-name']
      .forEach((id) => { this.els[id] = document.getElementById(id); });
  },

  showEmpty() {
    Spin.current = null;
    this.els['topic'].innerHTML = '<span class="empty-hint">bấm “Quay” để bốc một chủ đề 👇</span>';
    this.els['topic'].classList.remove('is-long', 'is-xlong');
    this.els['stage'].classList.remove('revealed', 'is-spinning', 'all-done');
  },

  renderGoals() {
    const all = Data.topics.length;
    const allLeft = Data.topics.filter((t) => !State.spunIds.has(t.id)).length;
    const pills = [
      { key: '', label: '✨ Tất cả', left: allLeft, total: all },
      ...Data.groups.map((g) => {
        const left = g.topics.filter((t) => !State.spunIds.has(t.id)).length;
        return { key: g.name, label: g.name, left, total: g.topics.length };
      }),
    ];
    this.els['goals'].innerHTML = pills.map((p) => `
      <button class="goal ${State.goal === p.key ? 'is-active' : ''}" type="button"
              role="tab" aria-selected="${State.goal === p.key}"
              data-goal="${Utils.escapeHtml(p.key)}">
        ${Utils.escapeHtml(p.label)}<small>${p.left}/${p.total}</small>
      </button>`).join('');
  },

  /** "Tất cả" mode: show which groups have had their turn in the current round. */
  renderRound() {
    const el = this.els['round'];
    if (State.goal) { el.textContent = ''; return; }
    const short = (n) => { const m = n.match(/\(([^)]+)\)/); return m ? m[1] : n; };
    const left = new Set(Spin.pool().map((t) => t.groupName));
    const parts = Data.groups
      .filter((g) => left.has(g.name) || State.round.includes(g.name))
      .map((g) => (State.round.includes(g.name) ? '✓ ' : '') + short(g.name));
    el.textContent = State.round.length ? 'Vòng này: ' + parts.join(' · ') : 'Luân phiên: ' + parts.join(' → ');
  },

  renderCounter() {
    const left = Spin.pool().length;
    const total = Spin.scopeTopics().length;
    this.els['counter'].textContent = left === 0
      ? `Đã quay hết ${total} chủ đề — bấm để bắt đầu vòng mới`
      : `Còn ${left}/${total} chủ đề chưa quay`;
    this.els['spin-btn'].textContent = left === 0 ? 'Quay lại từ đầu' : (Spin.current ? 'Quay tiếp' : 'Quay');
  },

  renderDataName() {
    this.els['data-name'].innerHTML = `Bộ chủ đề: <b>${Utils.escapeHtml(Data.sourceName)}</b>`;
    this.els['default-btn'].classList.toggle('hidden', !Data.usingCustom());
  },

  renderAll() {
    this.renderGoals();
    this.renderCounter();
    this.renderRound();
    this.renderDataName();
  },

  setSpinning(on) {
    const stage = this.els['stage'];
    stage.classList.toggle('is-spinning', on);
    stage.classList.remove('all-done');
    this.els['spin-btn'].disabled = on;
    if (on) {
      stage.classList.remove('revealed');
      this.els['topic'].textContent = '…';
    }
  },

  setShuffleFrame(pool) {
    const list = pool && pool.length ? pool : Data.topics;
    const t = list[Utils.randInt(list.length)];
    this.setTopicText(t.title);
    this.els['stage-label'].textContent = t.groupName;
  },

  /** Write the topic and pick a type size from its length (long prompts stay on screen). */
  setTopicText(text) {
    const el = this.els['topic'];
    el.textContent = text;
    el.classList.toggle('is-long', text.length > 70 && text.length <= 120);
    el.classList.toggle('is-xlong', text.length > 120);
  },

  reveal(topic, { restarted } = {}) {
    const stage = this.els['stage'];
    this.setTopicText(topic.title);
    this.els['stage-label'].textContent = topic.theme ? `${topic.groupName} · ${topic.theme}` : topic.groupName;
    stage.classList.remove('revealed');
    void stage.offsetWidth; // restart the pop animation
    stage.classList.add('revealed');
    if (typeof restarted === 'string') this.toast(`🔁 Nhóm “${restarted}” đã quay hết — bắt đầu lại nhóm này.`);
    else if (restarted) this.toast('🔁 Đã quay hết lượt trước — bắt đầu vòng mới trong mục tiêu này!');
  },

  /** Shown when the current scope has no topics left to draw (on load / goal switch). */
  showExhaustedNote() {
    this.els['stage'].classList.add('all-done');
  },

  toast(msg, ms = 2400) {
    const prev = document.querySelector('.toast');
    if (prev) prev.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('out'), ms);
    setTimeout(() => el.remove(), ms + 450);
  },
};

/* ---------------- App ---------------- */
const App = {
  init() {
    UI.cache();
    Data.load();
    State.load();
    UI.showEmpty();
    UI.renderAll();
    if (Spin.pool().length === 0) UI.showExhaustedNote();
    this.wire();
  },

  wire() {
    UI.els['spin-btn'].addEventListener('click', () => Spin.run());

    // Goal pills: switching the goal clears the stage, never the progress.
    UI.els['goals'].addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-goal]');
      if (!btn || Spin.running) return;
      State.goal = btn.dataset.goal;
      State.save();
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
    });

    UI.els['reset-spun'].addEventListener('click', () => {
      if (State.spunIds.size === 0) { UI.toast('Chưa có chủ đề nào được đánh dấu đã quay.'); return; }
      const ok = window.confirm('Đặt lại toàn bộ dấu "đã quay"?\nMọi chủ đề sẽ có thể xuất hiện lại từ đầu.');
      if (!ok) return;
      State.spunIds.clear();
      State.clearRotation();
      State.save();
      UI.showEmpty();
      UI.renderAll();
      UI.toast('↺ Đã đặt lại — tất cả chủ đề sẵn sàng quay lại.');
    });

    UI.els['load-btn'].addEventListener('click', () => UI.els['file-input'].click());
    UI.els['file-input'].addEventListener('change', () => {
      const f = UI.els['file-input'].files[0];
      UI.els['file-input'].value = '';
      this.importFile(f);
    });

    UI.els['default-btn'].addEventListener('click', () => {
      Storage.remove('customData');
      Data.apply(Data.normalize(EMBEDDED_DATA), CONFIG.defaultName);
      State.load(); // prune spun ids against the default set
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
      UI.toast('↩︎ Đã quay về bộ chủ đề mặc định.');
    });

    // Space = spin (ignored while typing in a focused control).
    document.addEventListener('keydown', (ev) => {
      if (ev.code === 'Space' && !ev.repeat && ev.target === document.body) {
        ev.preventDefault();
        Spin.run();
      }
    });
  },

  async importFile(file) {
    if (!file) return;
    try {
      const raw = JSON.parse(await file.text());
      const groups = Data.normalize(raw); // throws with a friendly message on bad shape
      Data.apply(groups, file.name.replace(/\.json$/i, ''));
      Storage.set('customData', { name: Data.sourceName, raw });
      State.load(); // prune spun ids + goal against the new set; surviving progress is kept
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
      UI.toast(`✅ Đã nạp "${Data.sourceName}": ${Data.groups.length} mục tiêu · ${Data.topics.length} chủ đề.`);
    } catch (e) {
      const detail = e && e.message ? e.message : 'Không đọc được file.';
      UI.toast(`❌ File không hợp lệ — giữ nguyên bộ chủ đề hiện tại.\n${detail}`, 3600);
    }
  },
};

/* Internal debug/test handle (not a public API). */
window.__QCD__ = { CONFIG, Utils, Storage, Data, State, Spin, UI, App };

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.init());
} else {
  App.init();
}
</script>
</body>
</html>
