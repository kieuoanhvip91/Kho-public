<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quay Chủ Đề</title>
<meta name="description" content="Bốc ngẫu nhiên chủ đề luyện nói theo mục tiêu — không lặp lại cho đến khi quay hết.">
<style>
/* ============================================================
   Quay Chủ Đề — single-file topic spinner
   Dark, warm, editorial look. No build step, no dependencies.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Prata&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');

:root {
  --bg: #100d0a;             /* warm near-black */
  --bg-soft: #17130e;
  --surface: #1d1812;
  --surface-2: #272017;
  --text: #f4eee3;
  --muted: #9d9183;
  --accent: #e8a33b;         /* spotlight amber */
  --accent-strong: #f0b45c;
  --accent-ink: #2a1f0c;
  --border: #322a1f;
  --radius: 12px;            /* blocks/cards max 12px */
  --radius-btn: 10px;        /* buttons 10px */
  --font-display: "Prata", "Times New Roman", Georgia, serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --speed: 0.25s;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1000px 520px at 50% -12%, #241b10 0%, transparent 62%),
    radial-gradient(760px 420px at 85% 110%, #1a140d 0%, transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  min-height: 100dvh;
  overflow-x: clip;
}

/* ---------- Header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 20px;
}
.brand { font-weight: 700; letter-spacing: 0.02em; font-size: 0.95rem; color: var(--muted); }
.brand b { color: var(--text); }
#reset-spun {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font: inherit; font-size: 0.78rem; padding: 7px 12px; border-radius: var(--radius-btn);
  cursor: pointer; transition: color var(--speed), border-color var(--speed);
  white-space: nowrap;
}
#reset-spun:hover { color: var(--text); border-color: var(--muted); }
.head-actions { display: flex; gap: 8px; align-items: center; }
#open-chosen {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  font: inherit; font-size: 0.78rem; font-weight: 600; padding: 7px 12px; border-radius: var(--radius-btn);
  cursor: pointer; white-space: nowrap; transition: border-color var(--speed);
}
#open-chosen:hover { border-color: var(--accent); }
#open-chosen b { color: var(--accent); }

/* ---------- Choose button (on the stage) ---------- */
.choose-btn {
  margin-top: 18px;
  font: inherit; font-size: 0.9rem; font-weight: 600;
  color: var(--text); background: var(--surface);
  border: 1px solid var(--accent); border-radius: var(--radius-btn);
  padding: 10px 20px; cursor: pointer;
  transition: background var(--speed), color var(--speed);
}
.choose-btn:hover { background: var(--surface-2); }
.choose-btn.is-chosen { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
.choose-btn[hidden] { display: none; }

/* ---------- Topic sheet (chosen list + search) ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet[hidden] { display: none; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62); }
.sheet-panel {
  position: relative; width: min(640px, 100%); max-height: min(86dvh, 760px);
  display: flex; flex-direction: column; gap: 12px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); text-align: left;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; }
.icon-btn {
  background: none; border: 1px solid var(--border); color: var(--muted); font: inherit;
  width: 36px; height: 36px; border-radius: var(--radius-btn); cursor: pointer;
}
.icon-btn:hover { color: var(--text); }
.tabs { display: flex; gap: 8px; }
.tab {
  font: inherit; font-size: 0.84rem; font-weight: 600; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
.tab.is-active { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
#topic-search {
  font: inherit; font-size: 0.95rem; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-btn);
  padding: 11px 14px; width: 100%; outline: none;
}
#topic-search:focus { border-color: var(--accent); }
.topic-list { list-style: none; margin: 0; padding: 0 2px 0 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
.topic-item {
  display: flex; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px;
}
.topic-item.is-chosen { border-color: rgba(232, 163, 59, 0.55); }
.ti-body { flex: 1; min-width: 0; }
.ti-meta { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.ti-title { font-size: 0.9rem; line-height: 1.45; overflow-wrap: break-word; }
.ti-btn {
  flex: none; font: inherit; font-size: 0.78rem; font-weight: 600;
  color: var(--text); background: none; border: 1px solid var(--border); border-radius: var(--radius-btn);
  padding: 7px 10px; cursor: pointer; white-space: nowrap;
}
.ti-btn:hover { border-color: var(--accent); }
.ti-btn.primary { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
.list-empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 22px 8px; }
body.sheet-open { overflow: hidden; }

/* ---------- Main ---------- */
main {
  flex: 1;
  width: min(860px, 100%);
  margin: 0 auto;
  padding: 10px 20px 28px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 5.4vw, 3rem);
  margin: 14px 0 6px;
  letter-spacing: 0.01em;
}
.tagline { color: var(--muted); margin: 0 0 22px; font-size: 0.95rem; }

/* ---------- Goal pills ---------- */
.goals {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 8px;
}
.goal {
  font: inherit; font-size: 0.84rem; font-weight: 600;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;            /* pill chips ≤48px tall: allowed */
  padding: 9px 16px;
  cursor: pointer;
  transition: all var(--speed);
  white-space: nowrap;
}
.goal:hover { color: var(--text); border-color: var(--muted); transform: translateY(-1px); }
.goal.is-active {
  color: var(--accent-ink);
  background: linear-gradient(180deg, var(--accent-strong), var(--accent));
  border-color: transparent;
  box-shadow: 0 6px 20px rgba(232, 163, 59, 0.28);
}
.goal small { font-weight: 500; opacity: 0.75; margin-left: 5px; }

/* ---------- Stage ---------- */
.stage {
  flex: 1;
  width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 44vh;
  padding: 18px 6px;
}
.stage-label {
  font-size: 0.74rem; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.topic {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.7rem, 5.8vw, 3.3rem);
  line-height: 1.22;
  max-width: 20ch;
  margin: 0;
  min-height: 1.2em;
  overflow-wrap: break-word;
}
.topic.is-long { font-size: clamp(1.35rem, 3.6vw, 2.25rem); max-width: 30ch; line-height: 1.3; }
.topic.is-xlong { font-size: clamp(1.2rem, 3vw, 1.85rem); max-width: 34ch; line-height: 1.35; }
.stage.revealed .stage-label,
.stage.is-spinning .stage-label { opacity: 1; transform: none; }
.stage.is-spinning .topic { filter: blur(1.5px); opacity: 0.6; }
.stage.revealed .topic { animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes pop {
  from { transform: scale(0.96); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.empty-hint {
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 400;
}
.done-note {
  margin-top: 14px; color: var(--muted); font-size: 0.9rem;
  display: none;
}
.stage.all-done .done-note { display: block; }

/* ---------- Action bar ---------- */
.actions {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-bottom: 6px;
  width: 100%;
}
#spin-btn {
  font: inherit; font-weight: 700; font-size: 1.05rem;
  color: var(--accent-ink);
  background: linear-gradient(180deg, var(--accent-strong), var(--accent));
  border: none; border-radius: var(--radius-btn);
  padding: 15px 44px;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(232, 163, 59, 0.3);
  transition: transform var(--speed), box-shadow var(--speed), filter var(--speed);
}
#spin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(232, 163, 59, 0.38); }
#spin-btn:active { transform: scale(0.98); }
#spin-btn:disabled { filter: saturate(0.4) brightness(0.8); cursor: wait; transform: none; }
.counter { color: var(--muted); font-size: 0.85rem; }
.round { color: var(--muted); font-size: 0.78rem; opacity: 0.85; max-width: 92vw; }
.kbd-hint { color: var(--muted); font-size: 0.78rem; opacity: 0.8; }
.kbd-hint kbd {
  font-family: inherit; font-size: 0.72rem;
  border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 6px; padding: 1px 7px; margin: 0 2px;
  background: var(--surface);
}

/* ---------- Footer (data tools) ---------- */
footer {
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: center;
  padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg-soft);
}
.linkish {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 0.82rem; cursor: pointer;
  padding: 6px 2px; text-decoration: none;
  transition: color var(--speed);
}
.linkish:hover { color: var(--text); }
.linkish.hidden { display: none; }
#data-name { color: var(--muted); font-size: 0.82rem; }
#data-name b { color: var(--text); font-weight: 600; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 18px; font-size: 0.88rem;
  max-width: min(92vw, 460px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
  white-space: pre-line; text-align: center;
  animation: toast-in 0.3s ease;
  z-index: 60;
}
.toast.out { opacity: 0; transition: opacity 0.4s ease; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ---------- Mobile ---------- */
@media (max-width: 480px) {
  main { padding: 6px 16px 20px; }
  .stage { min-height: 32vh; padding: 12px 4px; }
  #spin-btn { width: 100%; padding: 15px 20px; }
  .kbd-hint { display: none; }
  .round { font-size: 0.7rem; line-height: 1.5; padding-bottom: 4px; }
  .actions { gap: 6px; }
  header { padding: 12px 16px; }
  .brand { font-size: 0.85rem; }
  #reset-spun, #open-chosen { padding: 7px 9px; font-size: 0.74rem; }
  .sheet { padding: 0; align-items: flex-end; }
  .sheet-panel { max-height: 92dvh; border-radius: var(--radius) var(--radius) 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .topic-item { flex-wrap: wrap; }
  .ti-btn { margin-left: auto; }
}
@media (max-width: 360px) { .brand b { display: none; } }

@media (max-width: 480px) and (max-height: 720px) {
  h1 { font-size: 1.7rem; margin: 4px 0 4px; }
  .tagline { display: none; }
  .goal { padding: 7px 13px; }
  .choose-btn { margin-top: 12px; padding: 8px 16px; font-size: 0.85rem; }
  .stage-label { margin-bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <span class="brand">🎯 <b>Quay Chủ Đề</b></span>
  <div class="head-actions">
    <button id="open-chosen" type="button" title="Xem và tìm chủ đề đã chọn">☑ Đã chọn <b id="chosen-badge">0</b></button>
    <button id="reset-spun" type="button" title="Đặt lại các chủ đề đã quay (giữ nguyên chủ đề đã chọn)">↺ Đặt lại đã quay</button>
  </div>
</header>

<main>
  <h1>Hôm nay nói gì?</h1>
  <p class="tagline">Chọn mục tiêu rồi bấm quay — mỗi chủ đề chỉ xuất hiện một lần cho đến khi quay hết.</p>

  <div class="goals" id="goals" role="tablist" aria-label="Mục tiêu luyện tập"></div>

  <section class="stage" id="stage" aria-live="polite">
    <span class="stage-label" id="stage-label">Chủ đề của bạn</span>
    <h2 class="topic" id="topic"></h2>
    <button class="choose-btn" id="choose-btn" type="button" hidden>✓ Chọn chủ đề này</button>
    <p class="done-note" id="done-note">🎉 Bạn đã quay hết chủ đề trong mục tiêu này.</p>
  </section>

  <div class="actions">
    <button id="spin-btn" type="button">Quay</button>
    <span class="counter" id="counter"></span>
    <span class="round" id="round"></span>
    <span class="kbd-hint">nhấn <kbd>space</kbd> để quay</span>
  </div>
</main>

<footer>
  <span id="data-name"></span>
  <button class="linkish" id="load-btn" type="button">📂 Nạp bộ chủ đề khác (JSON)</button>
  <button class="linkish hidden" id="default-btn" type="button">↩︎ Về bộ mặc định</button>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h3 id="sheet-title">Chủ đề</h3>
      <button class="icon-btn" type="button" data-close aria-label="Đóng">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab is-active" type="button" data-tab="chosen">✓ Đã chọn (<span id="chosen-count">0</span>)</button>
      <button class="tab" type="button" data-tab="all">Tất cả chủ đề</button>
    </div>
    <input id="topic-search" type="search" placeholder="🔍 Tìm chủ đề…" autocomplete="off">
    <ul class="topic-list" id="topic-list"></ul>
  </section>
</div>

<script>
'use strict';
/* ============================================================
   Data — embedded at build time from topics.json.
   Schema: [ { group, topics: [ {title, ...} | "title" ] } ]
   (extra fields like "skills"/"questions" are accepted and ignored,
    so the same topics.json also works for the Weekly Speaking app)
   ============================================================ */
const EMBEDDED_DATA = [{"group":"Storytelling (Kể chuyện)","topics":[{"title":"Kể về một niềm tin tiêu cực bạn từng mang (“tôi phải hoàn hảo”, “tôi phải làm mọi người hài lòng”) và khoảnh khắc bạn nhận ra nó đang điều khiển mình.","theme":"Nội tâm"},{"title":"Chọn 1 dòng trong bảng chuyển hóa niềm tin của nhóm, kể chuyện thật của bạn theo 3 nấc: niềm tin tiêu cực → niềm tin cân bằng → niềm tin nuôi dưỡng.","theme":"Nội tâm"},{"title":"Trong 3 nhóm niềm tin về bản thân — Năng lực, Đáng được yêu, Giá trị — nhóm nào bạn thấy mình “yếu” nhất? Kể một tình huống tuần này cho thấy điều đó.","theme":"Nội tâm"},{"title":"“Tảng băng chìm”: kể một hành vi bạn hay lặp lại (trì hoãn, cả nể, nổi nóng) rồi đào xuống phần chìm — cảm xúc và niềm tin nào nằm bên dưới?","theme":"Nội tâm"},{"title":"Bạn từng cả nể hay tin người đến mức chịu thiệt? Kể lại, và nói vì sao đến giờ bạn vẫn chọn (hoặc thôi) tin người.","theme":"Quan hệ & ứng xử"},{"title":"Một lời khen hay lời chê từ nhiều năm trước vẫn còn “vang” trong đầu bạn đến hôm nay: đó là câu gì, và nó đã định hình bạn ra sao?","theme":"Nội tâm"},{"title":"Bạn có dễ nói “không” không? Kể một lần bạn từ chối được một lời nhờ vả khó, và cảm giác của bạn trước – trong – sau khi nói.","theme":"Quan hệ & ứng xử"},{"title":"Khi gặp chuyện buồn, bạn thường tìm đến ai hoặc làm gì đầu tiên? Điều đó nói gì về cách bạn tự chăm sóc mình?","theme":"Nội tâm"},{"title":"“Sống ở hiện tại” khó hơn mọi người nghĩ: kể một lần bạn ngồi thiền hay đọc sách mà đầu vẫn chạy lung tung, và cách bạn kéo mình về.","theme":"Nội tâm"},{"title":"Kể một lần bạn nhận ra mình đang “phóng đại sự việc” trong đầu — chuyện thật nhỏ hơn nhiều so với điều bạn tưởng tượng.","theme":"Nội tâm"},{"title":"“Cuộc sống là một trò chơi — mình có quyền chọn win-win hay lose-win.” Kể một lựa chọn gần đây bạn chủ động chọn cách chơi của riêng mình.","theme":"Nội tâm"},{"title":"Cảm xúc là yếu đuối hay là thông tin? Kể một lần bạn kìm nén cảm xúc và một lần bạn lắng nghe nó — kết quả  lực để thay đổi.","theme":"Phát triển bản thân"},{"title":"Lần gần nhất bạn phải góp ý cho ai đó: kể lại bạn đã nói thế nào, rồi nói lại cách bạn muốn nói nếu được làm lại.","theme":"Quan hệ & ứng xử"},{"title":"Kể về lần bạn chọn im lặng lắng nghe thay vì lên tiếng trong một cuộc thảo luận — bạn học được gì về mình từ vai người nghe?","theme":"Quan hệ & ứng xử"},{"title":"Kể về thầy cô giáo đã để lại dấu ấn sâu nhất trong những năm đi học của bạn — qua một khoảnh khắc cụ thể mà bạn nhớ mãi.","theme":"Kỷ niệm"},{"title":"Kể về ngày đầu tiên đi làm của bạn: từ lúc thức dậy, bước vào nơi làm việc, cho đến khi kết thúc ngày hôm đó.","theme":"Kỷ niệm"},{"title":"Kể về một chuyến đi đã thay đổi cách bạn nhìn cuộc sống: bạn đi đâu, gặp ai, và điều gì khiến bạn trở về khác đi.","theme":"Kỷ niệm"},{"title":"Kể về một lần bạn được một người lạ giúp đỡ (hoặc bạn giúp một người lạ) — và điều đó để lại gì trong bạn.","theme":"Kỷ niệm"},{"title":"Kể câu chuyện đằng sau một món đồ bạn đã giữ gìn nhiều năm mà không nỡ bỏ đi.","theme":"Kỷ niệm"},{"title":"Kể về một lần bạn phải chọn giữa hai con đường quan trọng: bạn đã cân nhắc thế nào, chọn gì, và nhìn lại thấy ra sao?","theme":"Kỷ niệm"},{"title":"Kể một kỷ niệm với ông bà hoặc một người lớn tuổi trong gia đình khiến bạn nhớ mãi.","theme":"Gia đình"},{"title":"Kể về một lần bạn vượt qua nỗi sợ của chính mình — từ lúc run sợ, giây phút quyết định, đến khi làm được.","theme":"Kỷ niệm"},{"title":"Kể về một lần mọi thứ đi sai kế hoạch (một chuyến đi, một sự kiện, một dự án) nhưng kết quả lại tốt đẹp bất ngờ.","theme":"Kỷ niệm"},{"title":"Kể về khoảnh khắc bạn tự hào nhất về bản thân trong năm nay, và điều gì đã giúp bạn làm được.","theme":"Kỷ niệm"}]},{"group":"Pitching (Thuyết phục)","topics":[{"title":"Nếu chỉ được dạy con MỘT kỹ năng sống trước năm 15 tuổi, bạn chọn gì? Thuyết phục cả nhóm trong 2 phút.","theme":"Gia đình"},{"title":"Trình bày cách chia ngân sách chi tiêu hằng tháng cho một gia đình 4 người sao cho vẫn có tiền tiết kiệm và tiền “tận hưởng”.","theme":"Tiền bạc"},{"title":"Lập “kế hoạch an toàn” cho gia đình khi có sự cố: cháy nổ, mất điện kéo dài, trẻ đi lạc — mỗi người trong nhà cần biết làm gì?","theme":"Kỹ năng sống"},{"title":"Thuyết phục cả nhà dành một buổi tối mỗi tuần “không thiết bị điện tử” để cùng làm một hoạt động chung — đề xuất hoạt động cụ thể và cách bắt đầu ngay tuần này.","theme":"Gia đình"},{"title":"Chăm sóc bố mẹ già khi mình bận rộn và ở xa: chia sẻ những cách thực tế để vẫn quan tâm đều đặn.","theme":"Gia đình"},{"title":"Hướng dẫn một người mới ra ở riêng những việc phải làm trong tuần đầu: hợp đồng thuê nhà, điện nước, an ninh, đi chợ.","theme":"Kỹ năng sống"},{"title":"Dạy con kỹ năng tự bảo vệ bản thân khi không có người lớn bên cạnh: bạn sẽ dạy những điều gì, và dạy bằng cách nào để con nhớ?","theme":"Gia đình"},{"title":"Bữa cơm gia đình có còn quan trọng trong thời đại ai cũng bận? Thuyết phục một gia đình “mỗi người ăn một giờ” quay lại ăn chung.","theme":"Gia đình"},{"title":"Quỹ dự phòng khẩn cấp cho gia đình: nên có bao nhiêu, để ở đâu, khi nào mới được dùng? Trình bày như tư vấn cho một cặp vợ chồng trẻ.","theme":"Tiền bạc"},{"title":"Lên kế hoạch một chuyến du lịch gia đình 3 ngày với ngân sách có hạn: điểm đến, lịch trình, mẹo tiết kiệm — trình bày để cả nhà “chốt” ngay.","theme":"Gia đình"},{"title":"Nếu được thêm một môn học “kỹ năng sống” vào chương trình phổ thông, bạn sẽ đề xuất nội dung gì? Trình bày như đang thuyết phục hội đồng nhà trường.","theme":"Kỹ năng sống"},{"title":"“Mỗi người một tốc độ”: vì sao so sánh tiến độ với người khác lại dễ khiến ta bỏ cuộc, và làm sao để chỉ so với chính mình hôm qua?","theme":"Nội tâm"},{"title":"Stress có phải lúc nào cũng xấu? Phân biệt “stress tích cực” và “stress tiêu cực” bằng ví dụ đời thường.","theme":"Sức khỏe"},{"title":"Thiên nhiên có vai trò thế nào với sức khỏe của người sống ở thành phố? Đề xuất cách “mang thiên nhiên” vào cuộc sống bận rộn.","theme":"Sức khỏe"},{"title":"Công việ const CONFIG = {
  storagePrefix: 'qcd.v1.',
  spinMs: 1300,          // shuffle duration (ease-out)
  defaultName: 'Bộ mặc định',
  recentShown: 6,        // topics shown in the last N spins are never re-shown when a group has to recycle
  themeGap: 3,           // a content area may not repeat within this many previous draws (=> 4 in a row are all different)
};

/* ---------------- Utils ---------------- */
const Utils = {
  randInt(n) {
    if (n <= 0) return 0;
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  },
  escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  },
  /** Lowercase + strip Vietnamese diacritics, for accent-insensitive search. */
  fold(s) {
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
  },
  prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  },
};

/* ---------------- Storage (namespaced, fail-safe) ---------------- */
const Storage = {
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(CONFIG.storagePrefix + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(CONFIG.storagePrefix + key, JSON.stringify(value)); } catch (_) {}
  },
  remove(key) {
    try { localStorage.removeItem(CONFIG.storagePrefix + key); } catch (_) {}
  },
};

/* ---------------- Data (normalize + validate) ---------------- */
const Data = {
  groups: [],   // [{ name, topics: [{id, title, groupName, groupIndex}] }]
  topics: [],   // flat list
  byId: new Map(),
  sourceName: CONFIG.defaultName,

  /** Validate raw JSON (same schema as topics.json) and normalize. Throws a friendly message on bad shape. */
  normalize(raw) {
    if (!Array.isArray(raw) || raw.length === 0) throw new Error('File phải là một mảng các nhóm mục tiêu.');
    const groups = [];
    const seen = new Set();
    raw.forEach((g, gi) => {
      if (!g || typeof g !== 'object' || typeof g.group !== 'string' || !g.group.trim()) {
        throw new Error(`Nhóm thứ ${gi + 1} thiếu tên ("group").`);
      }
      const name = g.group.trim();
      if (!Array.isArray(g.topics) || g.topics.length === 0) {
        throw new Error(`Nhóm "${name}" không có chủ đề nào.`);
      }
      const topics = g.topics.map((t, ti) => {
        const title = typeof t === 'string' ? t.trim()
          : (t && typeof t.title === 'string' ? t.title.trim() : '');
        if (!title) throw new Error(`Chủ đề thứ ${ti + 1} của nhóm "${name}" thiếu tiêu đề.`);
        // Stable id; duplicate titles stay independent via a suffix.
        let id = name + '::' + title;
        let n = 2;
        while (seen.has(id)) id = name + '::' + title + '::#' + (n++);
        seen.add(id);
        const theme = t && typeof t === 'object' && typeof t.theme === 'string' ? t.theme.trim() : '';
        return { id, title, theme, groupName: name, groupIndex: gi };
      });
      groups.push({ name, topics });
    });
    return groups;
  },

  apply(groups, sourceName) {
    this.groups = groups;
    this.topics = groups.flatMap((g) => g.topics);
    this.byId = new Map(this.topics.map((t) => [t.id, t]));
    this.sourceName = sourceName;
  },

  load() {
    const custom = Storage.get('customData', null);
    if (custom && custom.raw) {
      try {
        this.apply(this.normalize(custom.raw), custom.name || 'Bộ tùy chỉnh');
        return;
      } catch (_) { Storage.remove('customData'); /* corrupted -> fall back to default */ }
    }
    this.apply(this.normalize(EMBEDDED_DATA), CONFIG.defaultName);
  },

  usingCustom() { return this.sourceName !== CONFIG.defaultName; },
};

/* ---------------- State ---------------- */
const State = {
  spunIds: new Set(),   // topics already drawn (pruned to existing ids on load)
  goal: '',             // '' = all goals, otherwise a group name
  round: [],            // groups already drawn in the current rotation round ("Tất cả" mode)
  recent: [],           // last draws [{ group, theme }] — used to space out similar content
  chosen: [],           // [{ id, at }] topics the user ticked — never drawn again until un-ticked.
                        // Kept for every topic set (not pruned), so switching sets loses nothing.
  chosenSet: new Set(),
  shown: [],            // ids of the last few topics shown — never shown again right away, even when recycling

  load() {
    const s = Storage.get('spunIds', []);
    const valid = new Set(Data.topics.map((t) => t.id));
    this.spunIds = new Set((Array.isArray(s) ? s : []).filter((id) => valid.has(id)));
    const g = Storage.get('goal', '');
    this.goal = (g === '' || Data.groups.some((x) => x.name === g)) ? g : '';
    const names = new Set(Data.groups.map((x) => x.name));
    const r = Storage.get('round', []);
    this.round = (Array.isArray(r) ? r : []).filter((n) => names.has(n));
    const rc = Storage.get('recent', []);
    this.recent = (Array.isArray(rc) ? rc : [])
      .filter((x) => x && names.has(x.group))
      .map((x) => ({ group: x.group, theme: typeof x.theme === 'string' ? x.theme : '' }))
      .slice(-CONFIG.themeGap);
    const sh = Storage.get('shown', []);
    this.shown = (Array.isArray(sh) ? sh : []).filter((id) => typeof id === 'string').slice(-CONFIG.recentShown);
    const ch = Storage.get('chosen', []);
    this.chosen = (Array.isArray(ch) ? ch : [])
      .filter((x) => x && typeof x.id === 'string')
      .map((x) => ({ id: x.id, at: Number(x.at) || 0 }));
    this.chosenSet = new Set(this.chosen.map((x) => x.id));
    this.save(); // persist the pruned/validated view
  },
  save() {
    Storage.set('spunIds', [...this.spunIds]);
    Storage.set('goal', this.goal);
    Storage.set('round', this.round);
    Storage.set('recent', this.recent);
    Storage.set('chosen', this.chosen);
    Storage.set('shown', this.shown);
  },
  isChosen(id) { return this.chosenSet.has(id); },
  choose(id) {
    if (this.chosenSet.has(id)) return;
    this.chosen.push({ id, at: Date.now() });
    this.chosenSet.add(id);
    this.save();
  },
  /** Un-tick: the topic goes straight back into the spinnable pool. */
  unchoose(id) {
    this.chosen = this.chosen.filter((x) => x.id !== id);
    this.chosenSet.delete(id);
    this.spunIds.delete(id);
    this.save();
  },
  clearRotation() {
    this.round = [];
    this.recent = [];
  },
};

/* ---------------- Spin engine ---------------- */
const Spin = {
  running: false,
  current: null, // last drawn topic (not persisted: each visit starts on a clean stage)

  /** Topics that can still be drawn at all (chosen ones are out for good). */
  activeTopics() {
    return Data.topics.filter((t) => !State.isChosen(t.id));
  },
  activeOfGroup(name) {
    return Data.topics.filter((t) => t.groupName === name && !State.isChosen(t.id));
  },
  scopeTopics() {
    return State.goal ? this.activeOfGroup(State.goal) : this.activeTopics();
  },
  pool() {
    return this.scopeTopics().filter((t) => !State.spunIds.has(t.id));
  },

  /** Chosen topics (oldest → newest) that exist in the current set — one per practice week. */
  history() {
    return State.chosen.map((x) => Data.byId.get(x.id)).filter(Boolean);
  },

  /** Groups that still have topics left to choose from. */
  liveGroups() {
    return Data.groups.map((g) => g.name).filter((g) => this.activeOfGroup(g).length);
  },

  /**
   * Group rotation, derived from what was CHOSEN (not from how many times we spun):
   * every group gets chosen once per round; a new round never starts with the group chosen last.
   * Returns the groups already chosen in this round and the groups allowed for the next pick.
   */
  roundState(groups = this.liveGroups()) {
    const hist = this.history();
    let round = [];
    const full = () => groups.length > 0 && groups.every((g) => round.includes(g));
    for (const t of hist) {
      if (full()) round = [];
      if (!round.includes(t.groupName)) round.push(t.groupName);
    }
    if (full()) {
      const last = hist[hist.length - 1].groupName;
      return { round: [], eligible: groups.length > 1 ? groups.filter((g) => g !== last) : groups };
    }
    return { round, eligible: groups.filter((g) => !round.includes(g)) };
  },

  /**
   * Choose the next topic to show.
   * HARD rules (vs. the topics already CHOSEN, i.e. previous weeks) — every topic that can come up
   * satisfies them, so it does not matter whether the user picks on the 1st spin or the 4th:
   *   1. "Tất cả": only groups not yet chosen in the current round (see roundState).
   *   2. Content areas of the last CONFIG.themeGap chosen topics are excluded
   *      (=> 4 chosen topics in a row are all different), with a look-ahead so the rest of the
   *      round still has room. The window only shrinks when nothing else is left.
   * SOFT rules (vs. recent SPINS, for variety while picking): prefer a different group and
   * content area than the last few spins.
   */
  pick(pool) {
    const gap = CONFIG.themeGap;
    const chosenThemes = this.history().map((t) => t.theme);
    const unspun = new Set(pool.map((t) => t.id));
    const justShown = new Set(State.shown);
    // Everything a group may still offer: unspun first, then spun-but-not-chosen (recycled),
    // but never a topic shown in the last few spins.
    const sourceOf = (g) => {
      const all = this.activeOfGroup(g);
      const fresh = all.filter((t) => !justShown.has(t.id));
      return fresh.length ? fresh : all;
    };
    let group = State.goal;
    let allowedHard = null; // content areas allowed vs chosen topics (look-ahead, "Tất cả" mode)
    let allowedSoft = null; // ...and also unlike the last few spins (preference only)

    if (!State.goal) {
      const { eligible } = this.roundState();
      const spinThemes = State.recent.map((r) => r.theme);
      // Content areas group g can offer, banning the last `gap` of BOTH lists.
      // Soft planning looks at what the group can offer WITHOUT repeating (unspun first).
      const unspunOf = (g) => {
        const left = pool.filter((t) => t.groupName === g && !justShown.has(t.id));
        return left.length ? left : sourceOf(g);
      };
      const themesOf = (g, hardT, softT) => {
        const banned = new Set([...hardT.slice(-gap), ...softT.slice(-gap)].filter(Boolean));
        const src = softT.length ? unspunOf(g) : sourceOf(g);
        return [...new Set(src.map((t) => t.theme))].filter((th) => !th || !banned.has(th));
      };
      // Look-ahead: can the remaining groups of the round each still get a free content area?
      const feasible = (groups, hardT, softT, soft) => !groups.length || groups.some((g) =>
        themesOf(g, hardT, softT).some((th) => feasible(groups.filter((x) => x !== g),
          soft ? hardT : [...hardT, th], soft ? [...softT, th] : softT, soft)));
      const lookahead = (groups, soft) => {
        const ok = {};
        for (const g of groups) {
          const rest = groups.filter((x) => x !== g);
          ok[g] = themesOf(g, chosenThemes, soft ? spinThemes : [])
            .filter((th) => feasible(rest, soft ? chosenThemes : [...chosenThemes, th], soft ? [...spinThemes, th] : [], soft));
        }
        return ok;
      };
      // HARD: rotation + content spacing vs the CHOSEN topics (previous weeks).
      const okHard = lookahead(eligible, false);
      const safe = eligible.filter((g) => okHard[g].length);
      const roomy = eligible.filter((g) => themesOf(g, chosenThemes, []).length);
      const base = safe.length ? safe : (roomy.length ? roomy : eligible);

      // SOFT: variety between spins — a spin round over the allowed groups (never the group just
      // shown) and content areas unlike the last few spins, still honouring the hard rules.
      if (base.every((g) => State.round.includes(g))) State.round = [];
      const lastSpun = State.recent.length ? State.recent[State.recent.length - 1].group : null;
      let spinGroups = base.filter((g) => !State.round.includes(g) && g !== lastSpun);
      if (!spinGroups.length) spinGroups = base.filter((g) => g !== lastSpun);
      if (!spinGroups.length) spinGroups = base;
      const okSoft = lookahead(spinGroups, true);
      const softOk = (g) => okSoft[g].filter((th) => !safe.length || okHard[g].includes(th));
      const best = spinGroups.filter((g) => softOk(g).length);

      group = best.length ? best[Utils.randInt(best.length)] : spinGroups[Utils.randInt(spinGroups.length)];
      if (safe.length) allowedHard = new Set(okHard[group]);
      if (best.length) allowedSoft = new Set(softOk(group));
    }

    const source = sourceOf(group);
    // Hard content-area rule vs chosen topics; the window shrinks only if nothing is left.
    let ruled = [];
    if (allowedHard) ruled = source.filter((t) => allowedHard.has(t.theme));
    for (let g = gap; !ruled.length && g >= 0; g--) {
      const banned = new Set(g > 0 ? chosenThemes.slice(-g).filter(Boolean) : []);
      ruled = source.filter((t) => !t.theme || !banned.has(t.theme));
    }
    // Prefer topics not spun yet; recycle spun ones only when the group has none left.
    // (variety between spins never forces a repeat: it only narrows within the same tier)
    const fresh = ruled.filter((t) => unspun.has(t.id));
    let candidates = fresh.length ? fresh : ruled;
    const recycled = !fresh.length;
    if (allowedSoft) {
      const c = candidates.filter((t) => allowedSoft.has(t.theme));
      if (c.length) candidates = c;
    }
    // Soft: avoid content areas of the last few spins.
    for (let g = gap; g > 0; g--) {
      const banned = new Set(State.recent.slice(-g).map((r) => r.theme).filter(Boolean));
      const c = candidates.filter((t) => !t.theme || !banned.has(t.theme));
      if (c.length) { candidates = c; break; }
    }
    const chosen = candidates[Utils.randInt(candidates.length)];
    // Recycling a group = starting its no-repeat list again (keep only what was just shown).
    let restartedGroup = null;
    if (recycled && !State.goal && pool.every((t) => t.groupName !== group)) {
      const ids = new Set(Data.topics.filter((t) => t.groupName === group && !justShown.has(t.id)).map((t) => t.id));
      State.spunIds = new Set([...State.spunIds].filter((id) => !ids.has(id)));
      restartedGroup = group;
    }
    return { chosen, candidates, restartedGroup };
  },

  /** Reset the no-repeat marks of the CURRENT scope only (other goals keep their progress). */
  resetScope() {
    const scope = new Set(this.scopeTopics().map((t) => t.id));
    State.spunIds = new Set([...State.spunIds].filter((id) => !scope.has(id)));
    State.save();
  },

  async run(opts = {}) {
    if (this.running || Data.topics.length === 0) return;
    if (this.scopeTopics().length === 0) {
      UI.toast('Tất cả chủ đề ở mục này đã được chọn.\nBỏ chọn bớt trong “☑ Đã chọn” để quay tiếp.', 3200);
      return;
    }

    let pool = this.pool();
    let restarted = false;
    if (pool.length === 0 && State.goal) { // single group exhausted -> fresh round of that group
      this.resetScope();
      pool = this.pool();
      restarted = true;
    }

    const { chosen, candidates, restartedGroup } = this.pick(pool);
    if (restartedGroup) restarted = restartedGroup;
    // Only happens when the group whose turn it is has almost nothing left to offer.
    const repeated = State.shown.includes(chosen.id);
    State.spunIds.add(chosen.id);
    if (!State.goal) State.round.push(chosen.groupName);
    State.recent.push({ group: chosen.groupName, theme: chosen.theme });
    State.recent = State.recent.slice(-CONFIG.themeGap);
    State.shown = [...State.shown.filter((id) => id !== chosen.id), chosen.id].slice(-CONFIG.recentShown);
    this.current = chosen;
    State.save();

    this.running = true;
    UI.setSpinning(true);
    if (!opts.instant && !Utils.prefersReducedMotion()) {
      await this.animate(candidates);
    }
    UI.setSpinning(false);
    this.running = false;

    UI.reveal(chosen, { restarted });
    if (repeated) {
      const n = this.activeOfGroup(chosen.groupName).length;
      UI.toast(`Nhóm “${chosen.groupName}” chỉ còn ${n} chủ đề chưa chọn — hãy chọn một trong số này.`, 3200);
    }
    UI.renderAll();
  },

  /** Slot-machine shuffle across the current pool, decelerating (ease-out). */
  animate(pool) {
    return new Promise((resolve) => {
      const start = Date.now();
      const step = () => {
        const elapsed = Date.now() - start;
        if (elapsed >= CONFIG.spinMs) { resolve(); return; }
        UI.setShuffleFrame(pool);
        const p = elapsed / CONFIG.spinMs;
        setTimeout(step, 50 + p * p * 240);
      };
      step();
    });
  },
};

/* ---------------- UI ---------------- */
const UI = {
  els: {},
  cache() {
    ['goals', 'stage', 'stage-label', 'topic', 'done-note',
     'spin-btn', 'counter', 'round', 'reset-spun', 'load-btn', 'default-btn', 'file-input', 'data-name',
     'choose-btn', 'open-chosen', 'chosen-badge', 'sheet', 'topic-search', 'topic-list', 'chosen-count']
      .forEach((id) => { this.els[id] = document.getElementById(id); });
  },

  showEmpty() {
    Spin.current = null;
    this.els['topic'].innerHTML = '<span class="empty-hint">bấm “Quay” để bốc một chủ đề 👇</span>';
    this.els['topic'].classList.remove('is-long', 'is-xlong');
    this.els['stage'].classList.remove('revealed', 'is-spinning', 'all-done');
    this.renderChooseBtn();
  },

  /** The tick button under the drawn topic. */
  renderChooseBtn() {
    const btn = this.els['choose-btn'];
    const t = Spin.current;
    btn.hidden = !t || Spin.running;
    if (!t) return;
    const on = State.isChosen(t.id);
    btn.classList.toggle('is-chosen', on);
    btn.textContent = on ? '✓ Đã chọn — bấm để bỏ chọn' : '✓ Chọn chủ đề này';
  },

  renderGoals() {
    const active = Spin.activeTopics();
    const all = active.length;
    const allLeft = active.filter((t) => !State.spunIds.has(t.id)).length;
    const pills = [
      { key: '', label: '✨ Tất cả', left: allLeft, total: all },
      ...Data.groups.map((g) => {
        const ts = g.topics.filter((t) => !State.isChosen(t.id));
        const left = ts.filter((t) => !State.spunIds.has(t.id)).length;
        return { key: g.name, label: g.name, left, total: ts.length };
      }),
    ];
    this.els['goals'].innerHTML = pills.map((p) => `
      <button class="goal ${State.goal === p.key ? 'is-active' : ''}" type="button"
              role="tab" aria-selected="${State.goal === p.key}"
              data-goal="${Utils.escapeHtml(p.key)}">
        ${Utils.escapeHtml(p.label)}<small>${p.left}/${p.total}</small>
      </button>`).join('');
  },

  /** "Tất cả" mode: rotation of CHOSEN topics — which groups were chosen this round, which are next. */
  renderRound() {
    const el = this.els['round'];
    if (State.goal) { el.textContent = ''; return; }
    const short = (n) => { const m = n.match(/\(([^)]+)\)/); return m ? m[1] : n; };
    const groups = Spin.liveGroups();
    const { round, eligible } = Spin.roundState(groups);
    el.textContent = round.length
      ? 'Vòng chọn: ' + groups.map((g) => (round.includes(g) ? '✓ ' : '') + short(g)).join(' · ')
      : 'Lượt chọn tới: ' + eligible.map(short).join(' · ');
  },

  renderCounter() {
    const left = Spin.pool().length;
    const total = Spin.scopeTopics().length;
    this.els['counter'].textContent = total === 0
      ? 'Tất cả chủ đề ở mục này đã được chọn'
      : left === 0
      ? `Đã quay hết ${total} chủ đề — bấm để bắt đầu vòng mới`
      : `Còn ${left}/${total} chủ đề chưa quay`;
    this.els['spin-btn'].textContent = left === 0 ? 'Quay lại từ đầu' : (Spin.current ? 'Quay tiếp' : 'Quay');
  },

  renderDataName() {
    this.els['data-name'].innerHTML = `Bộ chủ đề: <b>${Utils.escapeHtml(Data.sourceName)}</b>`;
    this.els['default-btn'].classList.toggle('hidden', !Data.usingCustom());
  },

  chosenTopics() {
    return State.chosen.map((x) => ({ ...x, topic: Data.byId.get(x.id) })).filter((x) => x.topic);
  },

  renderChosenBadge() {
    const n = this.chosenTopics().length;
    this.els['chosen-badge'].textContent = n;
    this.els['chosen-count'].textContent = n;
  },

  /* ----- Sheet: chosen list + search across all topics ----- */
  sheetTab: 'chosen',
  openSheet(tab = 'chosen') {
    this.sheetTab = tab;
    this.els['sheet'].hidden = false;
    document.body.classList.add('sheet-open');
    this.els['topic-search'].value = '';
    this.renderSheet();
  },
  closeSheet() {
    this.els['sheet'].hidden = true;
    document.body.classList.remove('sheet-open');
  },
  sheetOpen() { return !this.els['sheet'].hidden; },

  renderSheet() {
    if (!this.sheetOpen()) return;
    document.querySelectorAll('#sheet .tab').forEach((b) => b.classList.toggle('is-active', b.dataset.tab === this.sheetTab));
    const q = Utils.fold(this.els['topic-search'].value.trim());
    const match = (t) => !q || Utils.fold(`${t.title} ${t.groupName} ${t.theme}`).includes(q);
    const fmt = (ms) => { if (!ms) return ''; const d = new Date(ms); return ` · ${d.getDate()}/${d.getMonth() + 1}`; };
    let rows;
    if (this.sheetTab === 'chosen') {
      rows = this.chosenTopics().reverse()           // newest first
        .filter((x) => match(x.topic))
        .map((x) => this.topicRow(x.topic, fmt(x.at)));
    } else {
      rows = Data.topics.filter(match).map((t) => this.topicRow(t, ''));
    }
    const empty = this.sheetTab === 'chosen' && !this.chosenTopics().length
      ? 'Chưa chọn chủ đề nào. Quay ra chủ đề ưng ý thì bấm “✓ Chọn chủ đề này”.'
      : 'Không tìm thấy chủ đề phù hợp.';
    this.els['topic-list'].innerHTML = rows.length ? rows.join('') : `<li class="list-empty">${empty}</li>`;
  },

  topicRow(t, extra) {
    const on = State.isChosen(t.id);
    const meta = (t.theme ? `${t.groupName} · ${t.theme}` : t.groupName) + extra;
    return `<li class="topic-item ${on ? 'is-chosen' : ''}">
      <div class="ti-body"><div class="ti-meta">${Utils.escapeHtml(meta)}</div>
      <div class="ti-title">${Utils.escapeHtml(t.title)}</div></div>
      <button class="ti-btn ${on ? '' : 'primary'}" type="button" data-id="${Utils.escapeHtml(t.id)}">${on ? 'Bỏ chọn' : '✓ Chọn'}</button>
    </li>`;
  },

  renderAll() {
    this.renderChosenBadge();
    this.renderChooseBtn();
    this.renderSheet();
    this.renderGoals();
    this.renderCounter();
    this.renderRound();
    this.renderDataName();
  },

  setSpinning(on) {
    const stage = this.els['stage'];
    stage.classList.toggle('is-spinning', on);
    stage.classList.remove('all-done');
    this.els['spin-btn'].disabled = on;
    if (on) this.els['choose-btn'].hidden = true;
    if (on) {
      stage.classList.remove('revealed');
      this.els['topic'].textContent = '…';
    }
  },

  setShuffleFrame(pool) {
    const list = pool && pool.length ? pool : Data.topics;
    const t = list[Utils.randInt(list.length)];
    this.setTopicText(t.title);
    this.els['stage-label'].textContent = t.groupName;
  },

  /** Write the topic and pick a type size from its length (long prompts stay on screen). */
  setTopicText(text) {
    const el = this.els['topic'];
    el.textContent = text;
    el.classList.toggle('is-long', text.length > 70 && text.length <= 120);
    el.classList.toggle('is-xlong', text.length > 120);
  },

  reveal(topic, { restarted } = {}) {
    const stage = this.els['stage'];
    this.setTopicText(topic.title);
    this.els['stage-label'].textContent = topic.theme ? `${topic.groupName} · ${topic.theme}` : topic.groupName;
    stage.classList.remove('revealed');
    void stage.offsetWidth; // restart the pop animation
    stage.classList.add('revealed');
    if (typeof restarted === 'string') this.toast(`🔁 Nhóm “${restarted}” đã quay hết — bắt đầu lại nhóm này.`);
    else if (restarted) this.toast('🔁 Đã quay hết lượt trước — bắt đầu vòng mới trong mục tiêu này!');
  },

  /** Shown when the current scope has no topics left to draw (on load / goal switch). */
  showExhaustedNote() {
    this.els['stage'].classList.add('all-done');
  },

  toast(msg, ms = 2400) {
    const prev = document.querySelector('.toast');
    if (prev) prev.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('out'), ms);
    setTimeout(() => el.remove(), ms + 450);
  },
};

/* ---------------- App ---------------- */
const App = {
  init() {
    UI.cache();
    Data.load();
    State.load();
    UI.showEmpty();
    UI.renderAll();
    if (Spin.pool().length === 0) UI.showExhaustedNote();
    this.wire();
  },

  wire() {
    UI.els['spin-btn'].addEventListener('click', () => Spin.run());

    // Goal pills: switching the goal clears the stage, never the progress.
    UI.els['goals'].addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-goal]');
      if (!btn || Spin.running) return;
      State.goal = btn.dataset.goal;
      State.save();
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
    });

    // Reset only touches topics that were NOT chosen — chosen ones stay out of the draw.
    UI.els['reset-spun'].addEventListener('click', () => {
      const spunActive = [...State.spunIds].filter((id) => !State.isChosen(id));
      if (spunActive.length === 0) { UI.toast('Chưa có chủ đề nào được đánh dấu đã quay.'); return; }
      const ok = window.confirm('Đặt lại dấu "đã quay"?\nCác chủ đề chưa được chọn sẽ quay lại từ đầu.\nChủ đề đã chọn (☑) vẫn được giữ nguyên.');
      if (!ok) return;
      State.spunIds = new Set([...State.spunIds].filter((id) => State.isChosen(id)));
      State.clearRotation();
      State.save();
      UI.showEmpty();
      UI.renderAll();
      UI.toast('↺ Đã đặt lại — chủ đề đã chọn vẫn được giữ.');
    });

    // Tick / un-tick the topic currently on stage.
    UI.els['choose-btn'].addEventListener('click', () => {
      const t = Spin.current;
      if (!t || Spin.running) return;
      if (State.isChosen(t.id)) {
        State.unchoose(t.id);
        UI.toast('Đã bỏ chọn — chủ đề này có thể được quay lại.');
      } else {
        State.choose(t.id);
        UI.toast('☑ Đã chuyển vào “Đã chọn” — sẽ không quay ra nữa.');
      }
      UI.renderAll();
    });

    UI.els['open-chosen'].addEventListener('click', () => UI.openSheet('chosen'));
    UI.els['sheet'].addEventListener('click', (ev) => {
      if (ev.target.closest('[data-close]')) { UI.closeSheet(); return; }
      const tab = ev.target.closest('[data-tab]');
      if (tab) { UI.sheetTab = tab.dataset.tab; UI.renderSheet(); return; }
      const btn = ev.target.closest('.ti-btn[data-id]');
      if (btn) {
        const id = btn.dataset.id;
        if (State.isChosen(id)) State.unchoose(id); else State.choose(id);
        UI.renderAll();
      }
    });
    UI.els['topic-search'].addEventListener('input', () => UI.renderSheet());

    UI.els['load-btn'].addEventListener('click', () => UI.els['file-input'].click());
    UI.els['file-input'].addEventListener('change', () => {
      const f = UI.els['file-input'].files[0];
      UI.els['file-input'].value = '';
      this.importFile(f);
    });

    UI.els['default-btn'].addEventListener('click', () => {
      Storage.remove('customData');
      Data.apply(Data.normalize(EMBEDDED_DATA), CONFIG.defaultName);
      State.load(); // prune spun ids against the default set
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
      UI.toast('↩︎ Đã quay về bộ chủ đề mặc định.');
    });

    // Space = spin (ignored while typing in a focused control).
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && UI.sheetOpen()) { UI.closeSheet(); return; }
      if (UI.sheetOpen()) return;
      if (ev.code === 'Space' && !ev.repeat && ev.target === document.body) {
        ev.preventDefault();
        Spin.run();
      }
    });
  },

  async importFile(file) {
    if (!file) return;
    try {
      const raw = JSON.parse(await file.text());
      const groups = Data.normalize(raw); // throws with a friendly message on bad shape
      Data.apply(groups, file.name.replace(/\.json$/i, ''));
      Storage.set('customData', { name: Data.sourceName, raw });
      State.load(); // prune spun ids + goal against the new set; surviving progress is kept
      UI.showEmpty();
      UI.renderAll();
      if (Spin.pool().length === 0) UI.showExhaustedNote();
      UI.toast(`✅ Đã nạp "${Data.sourceName}": ${Data.groups.length} mục tiêu · ${Data.topics.length} chủ đề.`);
    } catch (e) {
      const detail = e && e.message ? e.message : 'Không đọc được file.';
      UI.toast(`❌ File không hợp lệ — giữ nguyên bộ chủ đề hiện tại.\n${detail}`, 3600);
    }
  },
};

/* Internal debug/test handle (not a public API). */
window.__QCD__ = { CONFIG, Utils, Storage, Data, State, Spin, UI, App };

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.init());
} else {
  App.init();
}
</script>
</body>
